<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>西水博物馆</title>
<style>
/* ============================================================
   GAME-TEMPLATE 基础框架（§3.1 画布缩放）
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0a; overflow: hidden;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  width: 100vw; height: 100vh;
  user-select: none; -webkit-user-select: none;
}
#game-container {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); transform-origin: center center;
  width: 1280px; height: 720px;
  background: #222; overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  cursor: url('images/cursor-default.png') 2 2, auto;
  display: flex;               /* room-area(1120) + ui-inventory(160) 并排 */
  align-items: stretch;
}

/* ============ §3.2 区域划分 ============ */
#room-area { width: 1120px; height: 720px; position: relative; overflow: hidden; background: #444; }
#ui-inventory {
  width: 160px; height: 720px;
  background-image: url('images/ui-inventory-bg.png'); background-size: cover;
  border-left: 2px solid #000;
  display: flex; flex-direction: column; align-items: center;
  padding: 15px 0; gap: 15px;
  overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
}
#ui-inventory::-webkit-scrollbar { display: none; }

/* ============ §3.3 房间系统 ============ */
.room { display: none; position: absolute; top: 0; left: 0;
  width: 1120px; height: 720px;
  background-size: cover; background-position: center; background-repeat: no-repeat; }
.room.active-room { display: block; }
#room-A { background-image: url('images/room-A-bg.png'); }
#room-B { background-image: url('images/room-B-bg.png'); }
#room-C { background-image: url('images/room-C-bg.png'); }

/* ============ §3.4 实体基类 ============ */
.entity {
  position: absolute;
  background-size: contain; background-repeat: no-repeat; background-position: center;
}
.clickable { transition: filter 0.2s; }
.clickable:hover { filter: brightness(1.2); }

/* ============ 房间实体定位 ============ */
#entity-npc1 { left: 747px; top: 223px; width: 373px; height: 497px; background-image: url('images/npc-1.png'); background-size: 100% 100%; z-index: 10; }
/* roomB：从左到右 NPC2、NPC4、NPC3，等间距 55px、对称居中 */
#entity-npc2 { left: 55px;  top: 320px; width: 300px; height: 400px; background-image: url('images/npc-2a.png'); z-index: 10; }
#entity-npc3 { left: 765px; top: 320px; width: 300px; height: 400px; background-image: url('images/npc-3.png');  z-index: 10; }
#entity-npc4 { left: 387.5px; top: 193.7663px; width: 345px; height: 402.2511px; background-image: url('images/npc-4a.png'); z-index: 10; } /* 实体框比例 693:808：宽 345 → 高 = 345 × 808/693 = 402.2511（以中心 (560,294.8918) 为锚放大 1.15 倍，再整体下移 100） */
#entity-npc5 { left: 0px;   top: 320px; width: 300px; height: 400px; background-image: url('images/npc-5.png'); z-index: 10; }
#entity-npc6 { left: 410px; top: 320px; width: 300px; height: 400px; background-image: url('images/npc-6.png');  z-index: 10; }
#entity-npc7 { left: 820px; top: 320px; width: 300px; height: 400px; background-image: url('images/npc-7.png');  z-index: 10; }

/* ============ §3.5 对话框 ============ */
#dialog-box {
  position: absolute; bottom: 40px; left: 160px;
  width: 800px; min-height: 70px;
  background: rgba(255,255,255,0.95); border: 3px solid #333; border-radius: 15px;
  color: #000; font-size: 20px; line-height: 1.7;
  padding: 20px; z-index: 10001; display: none;
  text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
#dialog-box.visible { display: block; animation: dialogIn 0.35s ease-out; }
@keyframes dialogIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* 完成/失败提示对话气泡：样式与相对位置完全对齐 NPC1 对话（#dialog-box），全局显示
   统一：不自动消失，点击气泡范围区域后才消失（失败提示会被自动重开清掉） */
#completion-bubble {
  position: absolute; bottom: 40px; left: 160px;
  width: 800px; min-height: 70px;
  background: rgba(255,255,255,0.95); border: 3px solid #333; border-radius: 15px;
  color: #000; font-size: 20px; line-height: 1.7;
  padding: 20px; z-index: 10001; display: none;
  text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  cursor: url('images/cursor-default.png') 2 2, auto;
}
#completion-bubble.show { display: block; animation: completionIn 0.35s ease-out; }
#completion-bubble .completion-hint {
  margin-top: 8px; font-size: 14px; color: #666; letter-spacing: 1px;
}

/* 对话框模态锁：对话框/提示显示期间锁定整个游戏界面，仅对话框本身可点击 */
#dialog-lock {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10000; display: none;
}
#dialog-lock.show { display: block; }
/* 仅淡入，不动 transform —— 气泡用 translateX(-50%) 居中，动画期间改动 transform 会导致先偏移错位再归位 */
@keyframes completionIn { from { opacity: 0; } to { opacity: 1; } }

/* ============ §3.5b 对话气泡 ============ */
.speech-bubble {
  position: absolute;
  background: rgba(30, 20, 40, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  color: #ccc;
  font-size: 20px;
  padding: 8px 20px;
  z-index: 190;
  display: none;
  white-space: nowrap;
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid rgba(30, 20, 40, 0.9);
}
/* 向右指的气泡变体（NPC4 气泡位于实体中部左侧，尾巴指向右侧的 NPC） */
.speech-bubble.bubble-right::after {
  bottom: auto; left: auto; right: -8px; top: 50%;
  transform: translateY(-50%);
  border: 8px solid transparent;
  border-left: 8px solid rgba(30, 20, 40, 0.9);
}
.speech-bubble.show { display: block; animation: bubbleIn 0.2s ease-out; }
@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ §3.6 导航按钮 ============ */
.nav-btn {
  position: absolute; top: 335px;
  width: 50px; height: 60px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  z-index: 150; opacity: 0.7; transition: opacity 0.3s, transform 0.2s; display: none;
}
.nav-btn:hover { filter: brightness(1.2); }
.nav-btn.visible { display: block; }
#nav-left  { left: 12px;  background-image: url('images/nav-left.png'); }
#nav-right { right: 12px; background-image: url('images/nav-right.png'); }

/* ============ §3.7 物品栏 ============ */
.inv-slot { width: 120px; height: 120px; background: rgba(0,0,0,0.3);
  border-radius: 5px; flex-shrink: 0; position: relative;
  display: flex; align-items: center; justify-content: center; }
.inv-slot:empty { border-style: dashed; }
.inv-item {
  width: 100%; height: 100%;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  border-radius: 3px;
  cursor: url('images/cursor-grab.png') 16 16, grab;
}
.inv-count {
  position: absolute; bottom: 5px; right: 8px;
  background: rgba(0,0,0,0.7); color: #ffd700;
  font-size: 14px; font-weight: bold;
  padding: 1px 6px; border-radius: 8px; pointer-events: none;
}

/* ============ §3.8 设置按钮 & 面板 ============ */
#settings-btn {
  position: absolute; top: 12px; right: 172px;
  width: 42px; height: 42px; z-index: 300; border-radius: 50%;
  background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.35);
  display: flex; justify-content: center; align-items: center;
  transition: all 0.25s ease;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#settings-btn:hover { background: rgba(0,0,0,0.75); border-color: rgba(255,255,255,0.6); transform: rotate(30deg); }
#settings-btn svg { width: 24px; height: 24px; fill: rgba(255,255,255,0.85); }
#settings-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: 400; display: none;
  align-items: center; justify-content: center;
}
#settings-overlay.show { display: flex; }
#settings-panel {
  position: relative; width: 400px;
  background: rgba(20, 20, 30, 0.92);
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 16px;
  padding: 32px 36px 28px;
  color: #e0e0e0;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  pointer-events: auto; box-sizing: border-box;
}
#settings-panel h3 { text-align: center; margin-bottom: 24px; font-size: 22px; font-weight: 500; letter-spacing: 2px; color: #fff; }
#settings-close-btn { position: absolute; top: 10px; right: 16px; width: 32px; height: 32px; background: none; border: none; color: #999; font-size: 24px; transition: color 0.2s; line-height: 32px; text-align: center; padding: 0; cursor: url('images/cursor-default.png') 2 2, auto; }
#settings-close-btn:hover { color: #fff; }
.setting-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.vol-icon { width: 22px; height: 22px; opacity: 0.7; flex-shrink: 0; }
.vol-label { width: 56px; text-align: right; font-size: 15px; color: #bbb; flex-shrink: 0; }
.setting-row input[type="range"] { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: rgba(255, 255, 255, 0.18); border-radius: 3px; outline: none; }
.setting-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #888; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: transform 0.15s ease; }
.setting-row input[type="range"]::-webkit-slider-thumb:hover { filter: brightness(1.2); }
.setting-row input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #888; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.setting-row input[type="range"]::-moz-range-thumb:hover { filter: brightness(1.2); }
.vol-value { width: 36px; text-align: center; font-size: 14px; color: #aaa; flex-shrink: 0; }
#settings-link-btn {
  width: 100%; margin-top: 24px; padding: 12px 0;
  background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 10px; color: #ddd; font-size: 16px; letter-spacing: 1px;
  text-align: center; transition: all 0.2s ease; cursor: url('images/cursor-default.png') 2 2, auto;
}
#settings-link-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.45); color: #fff; }

/* ============ §3.9 背包按钮 & 面板 ============ */
#backpack-btn {
  position: absolute; top: 12px; left: 1016px;
  width: 42px; height: 42px;
  background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.35);
  border-radius: 50%; z-index: 300;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s ease;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#backpack-btn:hover { background: rgba(0,0,0,0.75); border-color: rgba(255,255,255,0.6); }
#backpack-btn svg { width: 24px; height: 24px; fill: rgba(255,255,255,0.85); }
#backpack-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: 400; display: none; align-items: center; justify-content: center;
}
#backpack-overlay.show { display: flex; }
#backpack-panel {
  position: relative; width: 400px;
  background: rgba(20, 20, 30, 0.92); border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 16px; padding: 32px 36px 28px; color: #e0e0e0;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  pointer-events: auto; box-sizing: border-box;
}
#backpack-panel h3 { text-align: center; margin-bottom: 24px; font-size: 22px; font-weight: 500; letter-spacing: 2px; color: #fff; }
#backpack-close-btn { position: absolute; top: 10px; right: 16px; width: 32px; height: 32px; background: none; border: none; color: #999; font-size: 24px; transition: color 0.2s; line-height: 32px; text-align: center; padding: 0; cursor: url('images/cursor-default.png') 2 2, auto; }
#backpack-close-btn:hover { color: #fff; }
#backpack-grid { display: grid; grid-template-columns: repeat(3, 96px); gap: 12px; justify-content: center; }
.bp-slot { width: 96px; height: 96px; background: rgba(0,0,0,0.3); border-radius: 5px; display: flex; align-items: center; justify-content: center; }
.bp-slot:empty { border-style: dashed; }
.bp-item { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; border-radius: 3px; }

/* ============ §3.10 道具拾取弹窗 ============ */
#pickup-overlay {
  position: absolute; top: 0; left: 0;
  width: 1120px; height: 720px;
  background: rgba(0,0,0,0.7); z-index: 350; display: none;
  align-items: center; justify-content: center;
}
#pickup-overlay.visible { display: flex; }
#pickup-panel {
  background: #1a1a2e; border: 2px solid #555; border-radius: 16px;
  padding: 30px 40px; width: 300px; color: #fff;
  text-align: center;
}
#pickup-panel h3 { margin-bottom: 20px; font-size: 20px; letter-spacing: 2px; }
#pickup-item-img {
  width: 100px; height: 100px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  margin: 0 auto 12px;
}
#pickup-item-name { font-size: 16px; color: #ccc; margin-bottom: 24px; }
#pickup-confirm-btn {
  padding: 10px 40px;
  border: none; border-radius: 8px;
  background: #6b4d3a; color: #fff; font-size: 15px; cursor: url('images/cursor-default.png') 2 2, auto; letter-spacing: 2px;
}
#pickup-confirm-btn:hover { filter: brightness(1.2); }

/* ============ §3.11 横屏提示遮罩 ============ */
#landscape-hint {
  position: fixed; inset: 0;
  background: #0a0a0a; z-index: 100000;
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; color: #fff;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  text-align: center;
  user-select: none; -webkit-user-select: none;
}
#landscape-hint.show { display: flex; }
#landscape-hint-icon { width: 76px; height: 76px; animation: hintLockPulse 1.8s ease-in-out infinite; }
@keyframes hintLockPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
#landscape-hint p { font-size: 18px; letter-spacing: 2px; opacity: 0.85; }
#landscape-hint .hint-sub { font-size: 13px; opacity: 0.5; letter-spacing: 1px; }
#landscape-hint-close {
  margin-top: 8px; padding: 10px 40px;
  background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 24px; color: #ddd; font-size: 15px; letter-spacing: 2px;
  cursor: url('images/cursor-default.png') 2 2, auto; transition: background 0.2s, color 0.2s;
}
#landscape-hint-close:hover { background: rgba(255,255,255,0.2); color: #fff; }

/* ============ §4 自定义鼠标指针系统 ============ */
/* 统一：原生控件（<button>、滑块等）不继承自定义指针，这里显式指定 */
button, input[type="range"] { cursor: url('images/cursor-default.png') 2 2, auto; }
html.dragging, body.dragging, body.dragging * { cursor: none !important; }
#drag-cursor-follower {
  position: fixed; pointer-events: none; z-index: 99999;
  width: 32px; height: 32px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  transform: translate(-16px, -16px);
}
body.dragging .drag-over-target { filter: brightness(1.3) drop-shadow(0 0 6px cyan); }

/* ============================================================
   游戏专用：NPC 窗口（通用模态窗口，外观统一）
   ============================================================ */
#modal-overlay {
  position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
  background: rgba(0, 0, 0, 0.55); z-index: 500; display: none;
  align-items: center; justify-content: center;
}
#modal-overlay.show { display: flex; }
#modal-window {
  position: relative;
  width: 1140px; height: 620px;
  border-radius: 6px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
  display: flex; flex-direction: column; overflow: hidden;
}
/* 意见2：NPC2/3/5/6/7 点击打开的窗口调用本地贴图作为背景，去背景色/文字/边框 */
#modal-window.win-bg { background-image: url('images/window-bg.png'); background-size: cover; }
/* NPC3/6/7 各自的窗口背景贴图 */
#modal-window.npc3-bg { background-image: url('images/npc3-bg.png'); background-size: cover; }
#modal-window.npc6-bg { background-image: url('images/npc6-bg.png'); background-size: cover; }
#modal-window.npc7-bg { background-image: url('images/npc7-bg.png'); background-size: cover; }
/* 意见4：密码条窗口使用简单的深黑色半透明背景 */
#modal-window.slip-bg { background: rgba(0, 0, 0, 0.88); }
.win-close {
  position: absolute; top: 12px; right: 12px;
  width: 30px; height: 30px; background: rgba(0,0,0,0.35);
  border: none; color: #e8dcc8; font-size: 20px; line-height: 30px;
  border-radius: 3px; cursor: url('images/cursor-default.png') 2 2, auto; z-index: 10;
}
.win-close:hover { background: rgba(255,255,255,0.15); }
/* NPC3/6/7 窗口专用关闭键：隐形热区，悬停发亮（不影响拼图窗口与 npc2/npc5 窗口）
   位置不变、以原中心为锚点：原 30×30 @ top:12 right:12 → 中心距上/右各 12+15 = 27px
   面积 +30% ⇒ 边长 ×√1.3 = 30 × 1.140175 = 34.205px
   新偏移 = 27 − 34.205/2 = 9.897px（top/right 同步内缩，按键中心仍停在 27px 处）
   line-height 同步改为 34.205px，使 × 字符继续垂直居中、视觉落点不移动
   再向左侧扩大 30%：高度不变、只加宽、右边缘固定 → width 34.205 × 1.3 = 44.4665px
   高度恒定时 面积∝宽度，故「面积 +30%」与「宽度 +30%」在此等价；左边缘因此左移 10.2615px */
#modal-window.npc3-bg .win-close,
#modal-window.npc6-bg .win-close,
#modal-window.npc7-bg .win-close {
  top: 9.897px; right: 9.897px;
  width: 44.4665px; height: 34.205px; line-height: 34.205px;
  background: transparent; border: none; color: transparent;
  transition: background 0.2s, box-shadow 0.2s;
}
/* 悬停只发亮，× 字符始终不显示（color 全程保持 transparent） */
#modal-window.npc3-bg .win-close:hover,
#modal-window.npc6-bg .win-close:hover,
#modal-window.npc7-bg .win-close:hover {
  background: rgba(255, 255, 255, 0.18);
  box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
}
#modal-content {
  flex: 1; position: relative; display: flex;
  align-items: center; justify-content: center;
}
#modal-content.column { flex-direction: column; }
/* 意见3：NPC2 文件夹窗口，folder 置于窗口左上角 */
#modal-content.folder-mode { align-items: flex-start; justify-content: flex-start; padding: 20px; }

/* 文件夹（模仿 Windows：单击选中出现虚线框，双击打开） */
.folder-zone {
  position: relative; width: 160px; height: 160px;
  display: flex; align-items: center; justify-content: center;
  cursor: url('images/cursor-grab.png') 16 16, pointer;
}
.folder-zone .entity.folder { width: 120px; height: 120px; }
.folder-zone.selected .entity.folder { outline: 2px dashed #999; outline-offset: 2px; }

/* 密码条查看图（2:1） */
.slip-view { width: 800px; height: 400px; background-size: contain; background-repeat: no-repeat; background-position: center; }

/* 数字键盘 */
.key-display {
  width: 420px; height: 64px; background: rgba(0,0,0,0.5);
  border: 2px solid rgba(255,255,255,0.2); border-radius: 6px;
  color: #7fff7f; font-size: 34px; letter-spacing: 14px;
  display: flex; align-items: center; justify-content: center; margin-bottom: 26px;
  font-family: 'Consolas', 'Courier New', monospace;
}
.key-grid { display: grid; grid-template-columns: repeat(3, 110px); gap: 12px; }
.key-btn {
  height: 64px; background: #3a2f44; border: 2px solid rgba(255,255,255,0.18);
  border-radius: 8px; color: #e8dcc8; font-size: 24px; cursor: url('images/cursor-default.png') 2 2, auto; transition: filter 0.15s;
}
.key-btn:hover { filter: brightness(1.25); }

/* 扫雷 */
.ms-msg {

.ms-board {
  display: grid;

}
.ms-cell {
  width: 48px; height: 48px; background: #4a5560;

  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: bold; user-select: none;
  transition: filter 0.12s;
  /* 移动端长按标记：禁掉长按弹出菜单/放大镜与双击缩放 */
  -webkit-touch-callout: none; touch-action: manipulation;
}
.ms-cell:hover { filter: brightness(1.2); }
.ms-cell.revealed { background: #2c3540; cursor: url('images/cursor-default.png') 2 2, auto; }
.ms-cell.revealed:hover { filter: none; }
.ms-cell.mine { background: #7a1f1f; }
.ms-cell.flag { background: #5a4630; }
.ms-cell.n1 { color: #5cb8ff; }
.ms-cell.n2 { color: #4dff88; }
.ms-cell.n3 { color: #ff6b4a; }
.ms-cell.n4 { color: #b06bff; }
.ms-cell.n5 { color: #ffd24d; }
.ms-cell.n6 { color: #4ddbff; }
.ms-cell.n7 { color: #ff8ad8; }
.ms-cell.n8 { color: #ff5a5a; }

/* ============================================================
   游戏专用：拼图小游戏（严格模态，无法中途退回）
   ============================================================ */
#puzzle-overlay {
  position: absolute; top: 0; left: 0; width: 1280px; height: 720px;
  background: rgba(0, 0, 0, 0.75); z-index: 600; display: none;
  align-items: center; justify-content: center;
}
#puzzle-overlay.show { display: flex; }
#puzzle-window {
  position: relative;
  width: 1160px; height: 660px;
  background-image: url('images/puzzle-bg.png'); background-size: cover;
  border-radius: 6px;

}
.pwin-body { flex: 1; display: flex; justify-content: center; align-items: center; padding: 18px; gap: 48px; min-height: 0; }
#puzzle-msg {
  position: absolute; top: 56px; left: 50%; transform: translateX(-50%);

}

#puzzle-slots {
  width: 370px; height: 464px; flex-shrink: 0;
  /* 拼图盘底图：正好覆盖全部 4×5 拼图格子围合的区域
     （4×88 + 3×6 = 370，5×88 + 4×6 = 464，含格间缝隙）。
     画在元素背景层，天然位于所有 .puzzle-slot / .puzzle-frag 之下。
     目前是占位图，美术出图后整张替换即可，无需改代码 */
  background-image: url('images/puzzle-board-bg.png');

}

<script>
// ============================================================
// ① 设备识别（必须放在 <script> 最顶部，先于 resizeGame()）
// ============================================================
(function detectDevice() {
  const ua = navigator.userAgent;
  const isIOS     = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isMac     = /Mac/i.test(ua) && !isIOS;
  const isWindows = /Windows/i.test(ua);
  const isTablet   = /iPad/i.test(ua) || (isAndroid && !/Mobile/i.test(ua));
  const isMobileUA = /Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  const isTouch    = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const coarsePtr  = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;
  const noHover    = window.matchMedia ? window.matchMedia('(hover: none)').matches : false;
  const isTouchPrimary = coarsePtr && noHover;
  const isMobile   = isMobileUA || isTouchPrimary;
  const isWeChat  = /MicroMessenger/i.test(ua);
  const isQQ      = /QQ\//i.test(ua);
  const isSafari  = /Safari/i.test(ua) && !/Chrome|CriOS|Edg|OPR/i.test(ua);
  const isChrome  = /Chrome|CriOS/i.test(ua) && !/Edg|OPR/i.test(ua);
  const isEdge    = /Edg/i.test(ua);
  const isFirefox = /Firefox/i.test(ua);
  const isPortrait = window.matchMedia
    ? window.matchMedia('(orientation: portrait)').matches
    : window.innerHeight > window.innerWidth;
  window.deviceInfo = {
    isMobile, isTablet, isMobileDevice: isMobile || isTablet, isDesktop: !isMobile && !isTablet,
    isTouch, isIOS, isAndroid, isMac, isWindows,
    isWeChat, isQQ, isSafari, isChrome, isEdge, isFirefox,
    isPortrait, isLandscape: !isPortrait,
    os: isIOS ? 'ios' : isAndroid ? 'android' : isWindows ? 'windows' : isMac ? 'mac' : 'other',
    browser: isWeChat ? 'wechat' : isQQ ? 'qq' : isSafari ? 'safari'
           : isEdge ? 'edge' : isFirefox ? 'firefox' : isChrome ? 'chrome' : 'other',
    type: isMobile ? 'mobile' : isTablet ? 'tablet' : 'desktop'
  };
  const root = document.documentElement;
  root.classList.add('device-' + deviceInfo.type);
  root.setAttribute('data-device', deviceInfo.type);
  if (deviceInfo.isTouch)     root.classList.add('device-touch');
  if (deviceInfo.isIOS)       root.classList.add('device-ios');
  if (deviceInfo.isAndroid)   root.classList.add('device-android');
  if (deviceInfo.isWeChat)    root.classList.add('device-wechat');
  if (deviceInfo.isPortrait)  root.classList.add('device-portrait');
  else                        root.classList.add('device-landscape');
  console.log('📱 设备识别:', deviceInfo);
})();

// ============================================================
// ② 画布缩放 + 移动端强制横屏
// ============================================================
function resizeGame() {
  const gc = document.getElementById('game-container');
  const rotated = deviceInfo.isMobileDevice && deviceInfo.isPortrait;
  let s;
  if (rotated) {
    s = Math.min(window.innerHeight / 1280, window.innerWidth / 720);
    gc.style.transform = `translate(-50%, -50%) rotate(90deg) scale(${s})`;
  } else {
    s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    gc.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  gc.classList.toggle('rotated', rotated);
  window._gameScale = s;
}
window.addEventListener('resize', resizeGame);
resizeGame();

// ============================================================
// ③ 方向监听 + 横屏锁屏提示
// ============================================================
let landscapeHintDismissed = false;
let landscapeHintTimer = null;

function updateLandscapeHint() {
  const hint = document.getElementById('landscape-hint');
  if (!hint) return;

  } else if (!shouldShow) {

  }

// ============================================================
// 音效 API（§6.6）
// ============================================================
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function synthBeep(type) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    const base = { click: 600, nav: 500, dialogue: 440, collect: 880, success: 660, error: 200, place: 520 }[type] || 440;
    o.frequency.value = base;
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(sfxVolume * 0.5, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.28);
  } catch (e) {}
}
function playSound(type) {
  const el = document.getElementById('sfx-' + type);
  if (el) {
    el.volume = sfxVolume;
    el.currentTime = 0;
    const p = el.play();
    if (p) p.catch(() => synthBeep(type));
    else synthBeep(type);
  } else {
    synthBeep(type);
  }
}
function startBgm() {
  bgmStarted = true;
  const bgmEl = document.getElementById('bgm');
  if (bgmEl) { bgmEl.volume = musicVolume * 0.4; bgmEl.play().catch(() => {}); }
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    bgmOsc = ctx.createOscillator();
    const g = ctx.createGain();
    bgmOsc.type = 'sine';
    bgmOsc.frequency.value = 55;
    g.gain.value = musicVolume * 0.04;
    bgmOsc.connect(g); g.connect(ctx.destination);
    bgmOsc.start();
  } catch (e) {}
}
function stopBgm() {
  bgmStarted = false;
  const bgmEl = document.getElementById('bgm');
  if (bgmEl) bgmEl.pause();
  if (bgmOsc) { try { bgmOsc.stop(); } catch (e) {} bgmOsc = null; }
}

// ============================================================
// 手动拖拽引擎（§5.1）
// ============================================================
let dragCursorFollower = null;
let dragState = null;

function ensureCursorFollower() {
  if (!dragCursorFollower) {
    dragCursorFollower = document.createElement('div');
    dragCursorFollower.id = 'drag-cursor-follower';
    dragCursorFollower.style.backgroundImage = "url('images/cursor-grabbing.png')";
    document.body.appendChild(dragCursorFollower);
  }
}
function removeCursorFollower() {
  if (dragCursorFollower) { dragCursorFollower.remove(); dragCursorFollower = null; }
}
function cleanupDrag() {
  if (dragState && dragState.clone) dragState.clone.remove();
  dragState = null;
  document.body.classList.remove('dragging');
  removeCursorFollower();
  document.querySelectorAll('.drag-over-target').forEach(el => el.classList.remove('drag-over-target'));
}
function startManualDrag(e) {
  if (e.button !== 0) return;
  e.preventDefault();
  const itemEl = e.currentTarget;
  // 拖拽半透明图标保持物品栏原尺寸：用实际显示尺寸（含游戏容器缩放），而非布局尺寸
  const rect = itemEl.getBoundingClientRect ? itemEl.getBoundingClientRect() : null;
  const w = rect && rect.width ? rect.width : itemEl.offsetWidth;
  const h = rect && rect.height ? rect.height : itemEl.offsetHeight;
  const clone = document.createElement('div');
  clone.style.cssText = `
    position: fixed; pointer-events: none; z-index: 99998;
    width: ${w}px; height: ${h}px;
    background-image: ${itemEl.style.backgroundImage};
    background-size: contain; background-repeat: no-repeat; background-position: center;
    opacity: 0.85; display: none; transform: translate(-50%, -50%);
  `;
  document.body.appendChild(clone);
  dragState = { itemId: itemEl.getAttribute('data-item-id'), sourceEl: itemEl, startX: e.clientX, startY: e.clientY, started: false, clone: clone };
}
document.addEventListener('mousemove', function (e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  if (!dragState.started) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    dragState.started = true;
    document.body.classList.add('dragging');
    ensureCursorFollower();
    dragState.clone.style.display = 'block';
  }
  dragState.clone.style.left = e.clientX + 'px';
  dragState.clone.style.top = e.clientY + 'px';
  if (dragCursorFollower) { dragCursorFollower.style.left = e.clientX + 'px'; dragCursorFollower.style.top = e.clientY + 'px'; }
  const elUnder = document.elementFromPoint(e.clientX, e.clientY);
  const dropTarget = elUnder && elUnder.closest && elUnder.closest('[data-drop-target]');
  document.querySelectorAll('.drag-over-target').forEach(el => { if (el !== dropTarget) el.classList.remove('drag-over-target'); });
  if (dropTarget && !dropTarget.classList.contains('drag-over-target')) dropTarget.classList.add('drag-over-target');
});
document.addEventListener('mouseup', function (e) {
  if (!dragState) return;
  if (dragState.started) {
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 150);
    const elUnder = document.elementFromPoint(e.clientX, e.clientY);
    const dropTarget = elUnder && elUnder.closest && elUnder.closest('[data-drop-target]');
    if (dropTarget) handleDrop(dragState.itemId, dropTarget.dataset.dropTarget, dropTarget);
  }
  cleanupDrag();
});
document.getElementById('game-container').addEventListener('mouseleave', () => { if (dragState) cleanupDrag(); });

// 物品栏拖拽滚动（§5.2）

let isDraggingInventory = false, invScrollStartY = 0, invScrollTop = 0;
(function initInventoryScroll() {

// ============================================================
// 移动端触摸拖拽（§5.3）
// ============================================================
let touchDragItem = null;
let touchGhost = null;
let touchStartX = 0, touchStartY = 0;   // 记录按下位置，用于区分「轻点」与「拖拽」

function touchStart(ev) {
  if (ev.target.classList.contains('inv-item')) {
    ev.preventDefault();
    touchDragItem = ev.target.getAttribute('data-item-id');
    const touch = ev.touches[0];
    touchStartX = touch.clientX; touchStartY = touch.clientY;
    touchGhost = ev.target.cloneNode(true);
    touchGhost.style.position = 'fixed';
    touchGhost.style.width = '80px'; touchGhost.style.height = '80px';
    touchGhost.style.opacity = '0.8'; touchGhost.style.pointerEvents = 'none';
    touchGhost.style.zIndex = '9999';
    touchGhost.style.left = (touch.clientX - 40) + 'px';
    touchGhost.style.top = (touch.clientY - 40) + 'px';
    touchGhost.style.transform = 'scale(1.1)';
    document.body.appendChild(touchGhost);
  }
}
function touchMove(ev) {
  if (!touchGhost) return;
  ev.preventDefault();
  const touch = ev.touches[0];
  touchGhost.style.left = (touch.clientX - 40) + 'px';
  touchGhost.style.top = (touch.clientY - 40) + 'px';
  const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
  document.querySelectorAll('[data-drop-target]').forEach(el => el.classList.remove('drop-highlight'));
  if (elUnder && elUnder.closest && elUnder.closest('[data-drop-target]')) {
    elUnder.closest('[data-drop-target]').classList.add('drop-highlight');
  }
}
function touchEnd(ev) {
  document.querySelectorAll('[data-drop-target]').forEach(el => el.classList.remove('drop-highlight'));
  if (!touchGhost || !touchDragItem) return;
  const touch = ev.changedTouches[0];
  const itemId = touchDragItem;
  // 位移很小 → 视为「轻点」而不是拖拽，与桌面端 click 行为对齐（例如密码条点击展开窗口）。
  // touchstart 里调过 preventDefault()，浏览器不会再补发 click，所以这里必须手动补一次。
  const tapped = Math.abs(touch.clientX - touchStartX) < 8 && Math.abs(touch.clientY - touchStartY) < 8;
  const elUnder = tapped ? null : document.elementFromPoint(touch.clientX, touch.clientY);
  const dropTarget = elUnder && elUnder.closest && elUnder.closest('[data-drop-target]');

  if (touchGhost.parentNode) touchGhost.parentNode.removeChild(touchGhost);
  touchGhost = null; touchDragItem = null;

  justDragged = true;                                   // 短暂屏蔽随后可能补发的 click
  setTimeout(() => { justDragged = false; }, 150);

  if (dropTarget) handleDrop(itemId, dropTarget.dataset.dropTarget, dropTarget);
  else if (tapped) onItemClick(itemId);
}

// ============================================================
// 拼图小游戏（4×5=20 碎片，左 2/3 空格，右 1/3 碎片区）
// ============================================================
const PUZZLE_COLS = 4, PUZZLE_ROWS = 5, PUZZLE_TOTAL = 20;
const PUZZLE_PIECE = 88;
const PUZZLE_BG_W = PUZZLE_COLS * PUZZLE_PIECE;   // 352
const PUZZLE_BG_H = PUZZLE_ROWS * PUZZLE_PIECE;   // 440
let pzDrag = null;
let puzzlePlacedCount = 0;

function setFragBg(el, idx) {
  // 每块碎片为独立占位图（puzzle-0..19.png，图内标注编号 1-20）
  el.style.backgroundImage = "url('images/puzzle-" + idx + ".png')";
  el.style.backgroundSize = 'cover';
}
function createPzClone(idx, frag) {
  // 克隆体挂在 body 上（未缩放），按源碎片实际渲染尺寸取宽高，保证跟拼图网格里的碎片一样大
  const r = frag ? frag.getBoundingClientRect() : null;
  const w = (r && r.width) ? r.width : PUZZLE_PIECE;
  const h = (r && r.height) ? r.height : PUZZLE_PIECE;
  const clone = document.createElement('div');
  clone.style.cssText = "position:fixed; pointer-events:none; z-index:99998; width:" + w + "px; height:" + h + "px;" +
    "background-image:url('images/puzzle-" + idx + ".png'); background-size:cover;" +
    "opacity:0.85; transform:translate(-50%,-50%); left:-9999px; top:-9999px;";
  document.body.appendChild(clone);
  return clone;
}
function clearPzHover() {
  document.querySelectorAll('#puzzle-slots .puzzle-slot.hover, #puzzle-stash.hover').forEach(el => el.classList.remove('hover'));
}
function openPuzzle() {
  const slotsEl = document.getElementById('puzzle-slots');
  const stashEl = document.getElementById('puzzle-stash');
  slotsEl.innerHTML = '';
  stashEl.innerHTML = '';
  puzzlePlacedCount = 0;
  for (let i = 0; i < PUZZLE_TOTAL; i++) {
    const slot = document.createElement('div');
    slot.className = 'puzzle-slot';
    slot.setAttribute('data-slot', i);
    slotsEl.appendChild(slot);
  }
  if (state.puzzleComplete) {
    // 意见1：拼图完成后再次打开显示完成态（全部槽位已填，无法再游玩）
    for (let i = 0; i < PUZZLE_TOTAL; i++) {
      const slot = slotsEl.querySelector('.puzzle-slot[data-slot="' + i + '"]');
      const frag = document.createElement('div');
      frag.className = 'puzzle-frag';
      frag.setAttribute('data-frag', i);
      setFragBg(frag, i);
      slot.appendChild(frag);
      slot.dataset.filled = i;
    }
    // 意见2：关闭按钮固定于拼图窗口右上角（游玩态/完成态共用）
    document.getElementById('puzzle-msg').classList.remove('show');
    document.getElementById('puzzle-overlay').classList.add('show');
    return;
  }
  // 意见1：待选区碎片乱序排列（Fisher-Yates 洗牌，编号仍正确）
  const order = [];
  for (let i = 0; i < PUZZLE_TOTAL; i++) order.push(i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  // 意见1：待选区与拼图空格区域同尺寸、平行并列，碎片按网格排布、顺序随机乱序
  for (const idx of order) {
    const frag = document.createElement('div');
    frag.className = 'puzzle-frag';
    frag.setAttribute('data-frag', idx);
    setFragBg(frag, idx);
    frag.addEventListener('mousedown', pzStart);
    frag.addEventListener('touchstart', pzTouchStart, { passive: false });
    frag.addEventListener('touchmove', pzTouchMove, { passive: false });
    frag.addEventListener('touchend', pzTouchEnd);
    stashEl.appendChild(frag);
  }
  document.getElementById('puzzle-msg').classList.remove('show');
  document.getElementById('puzzle-overlay').classList.add('show');
}
function pzStart(e) {
  if (e.button !== 0) return;
  if (dragState) return;
  const frag = e.currentTarget;
  e.preventDefault();
  pzDrag = { frag: frag, parent: frag.parentElement, clone: createPzClone(parseInt(frag.getAttribute('data-frag')), frag) };
  pzDrag.clone.style.left = e.clientX + 'px';
  pzDrag.clone.style.top = e.clientY + 'px';
  document.body.classList.add('dragging');
  ensureCursorFollower();
  // 立刻把自定义指针定位到鼠标处，避免创建后到下一次 mousemove 之间闪现在页面左上角
  if (dragCursorFollower) { dragCursorFollower.style.left = e.clientX + 'px'; dragCursorFollower.style.top = e.clientY + 'px'; }
}
function pzMove(e) {
  if (!pzDrag) return;
  pzDrag.clone.style.left = e.clientX + 'px';
  pzDrag.clone.style.top = e.clientY + 'px';
  if (dragCursorFollower) { dragCursorFollower.style.left = e.clientX + 'px'; dragCursorFollower.style.top = e.clientY + 'px'; }
  clearPzHover();
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const slot = el && el.closest ? el.closest('#puzzle-slots .puzzle-slot') : null;
  const stash = el && el.closest ? el.closest('#puzzle-stash') : null;
  if (slot && !slot.dataset.filled) slot.classList.add('hover');
  if (stash) stash.classList.add('hover');
}
function pzMouseUp(e) {
  if (!pzDrag) return;
  pzDropAt(e.clientX, e.clientY);
  document.body.classList.remove('dragging');
  removeCursorFollower();
}
document.addEventListener('mousemove', pzMove);
document.addEventListener('mouseup', pzMouseUp);

function pzTouchStart(e) {
  if (dragState) return;
  const frag = e.target.closest ? e.target.closest('.puzzle-frag') : null;
  if (!frag) return;
  e.preventDefault();
  const t = e.touches[0];
  pzDrag = { frag: frag, parent: frag.parentElement, clone: createPzClone(parseInt(frag.getAttribute('data-frag')), frag) };
  pzDrag.clone.style.left = t.clientX + 'px';
  pzDrag.clone.style.top = t.clientY + 'px';
}
function pzTouchMove(e) {
  if (!pzDrag) return;
  e.preventDefault();
  const t = e.touches[0];
  pzDrag.clone.style.left = t.clientX + 'px';
  pzDrag.clone.style.top = t.clientY + 'px';
  clearPzHover();
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const slot = el && el.closest ? el.closest('#puzzle-slots .puzzle-slot') : null;
  const stash = el && el.closest ? el.closest('#puzzle-stash') : null;
  if (slot && !slot.dataset.filled) slot.classList.add('hover');
  if (stash) stash.classList.add('hover');
}
function pzTouchEnd(e) {
  if (!pzDrag) return;
  const t = e.changedTouches[0];
  pzDropAt(t.clientX, t.clientY);
}
function pzDropAt(x, y) {
  let placed = false;
  const frag = pzDrag.frag;
  const fragIdx = parseInt(frag.getAttribute('data-frag'));
  const srcSlot = pzDrag.parent.classList.contains('puzzle-slot') ? pzDrag.parent : null;
  const el = document.elementFromPoint(x, y);
  const slot = el && el.closest ? el.closest('#puzzle-slots .puzzle-slot') : null;
  const stash = el && el.closest ? el.closest('#puzzle-stash') : null;
  if (slot && !slot.dataset.filled) {
    frag.remove();
    slot.appendChild(frag);
    slot.dataset.filled = fragIdx;
    if (srcSlot && srcSlot !== slot) { srcSlot.removeAttribute('data-filled'); }
    placed = true;
  } else if (stash) {
    frag.remove();
    document.getElementById('puzzle-stash').appendChild(frag);
    if (srcSlot) srcSlot.removeAttribute('data-filled');
    placed = true;
  } else {
    if (!srcSlot) document.getElementById('puzzle-stash').appendChild(frag);
  }
  pzDrag.clone.remove();
  pzDrag = null;
  clearPzHover();
  if (placed) {
    playSound('place');
    puzzlePlacedCount = document.querySelectorAll('#puzzle-slots .puzzle-slot[data-filled]').length;
    if (puzzlePlacedCount >= PUZZLE_TOTAL) checkPuzzle();
  }
}
function checkPuzzle() {
  let correct = true;
  for (let i = 0; i < PUZZLE_TOTAL; i++) {
    const slot = document.querySelector('#puzzle-slots .puzzle-slot[data-slot="' + i + '"]');
    if (parseInt(slot.dataset.filled) !== i) { correct = false; break; }
  }
  if (correct) {
    puzzleComplete();
  } else {
    showCompletionBubble('好像不太对欸', null, 2000);
  }
}
function puzzleComplete() {
  state.puzzleComplete = true;
  playSound('success');
  document.getElementById('entity-npc2').style.backgroundImage = "url('images/npc-2b.png')";
  // 意见1/4：拼图完成立刻获得「密码条」
  if (!state.slipGiven) {
    state.slipGiven = true;
    addItem('password-slip');
    playSound('collect');
  }
  // 意见2：完成提示为对话气泡（参照NPC1对话），全局显示，点击后关闭拼图窗口
  showCompletionBubble('游戏完成！获得密码条！', function () {
    document.getElementById('puzzle-overlay').classList.remove('show');
  });
}

function onKeyPress(k) {

  if (k === '⌫') { keypadValue = keypadValue.slice(0, -1); renderKeyDisplay(); return; }
  if (keypadValue.length >= 5) return;

// ============================================================
// 扫雷小游戏（8×8，随机 3~5 雷，通关自动退回 roomC）
// ============================================================
const MS_ROWS = 8, MS_COLS = 8;
let msMines = [], msRevealed = [], msFlags = [];
let msFirst = true, msMineCount = 0, msRevealCount = 0;
let msRestartTimer = null;
let msDead = false;   // 踩雷后本轮已结束：提示被点掉之前，盘面一律不响应
// 移动端长按标记：长按阈值 / 滑动容差 / 触点起点 / 是否已触发长按 / 本次触摸是否有效
const MS_LONG_PRESS = 480, MS_TOUCH_SLOP = 10;
let msTouchTimer = null, msTouchStartX = 0, msTouchStartY = 0;
let msTouchLongFired = false, msTouchActive = false;

function openMinesweeper() {
  clearTimeout(msRestartTimer);
  msTouchCancel(); // 重开时清掉可能残留的长按计时器
  completionBubbleOk(); // 自动重开时清掉残留的失败提示气泡
  document.getElementById('ms-hint-btn').classList.add('show');
  const content = document.getElementById('modal-content');
  content.innerHTML = '';
  content.className = 'column';
  // 意见6：去掉顶部信息行与重新开始按钮
  const msg = document.createElement('div');
  msg.className = 'ms-msg';
  msg.id = 'ms-msg';
  content.appendChild(msg);
  const board = document.createElement('div');
  board.className = 'ms-board';
  board.id = 'ms-board';
  content.appendChild(board);
  msMines = Array.from({ length: MS_ROWS }, () => new Array(MS_COLS).fill(false));
  msRevealed = Array.from({ length: MS_ROWS }, () => new Array(MS_COLS).fill(false));
  msFlags = Array.from({ length: MS_ROWS }, () => new Array(MS_COLS).fill(false));
  msFirst = true; msMineCount = 0; msRevealCount = 0;
  msDead = false;                    // 新盘面按可游玩状态起步（踩雷重开时再由 msRestartAfterDeath 封住）
  buildMsBoard();
}
function buildMsBoard() {
  const board = document.getElementById('ms-board');
  board.innerHTML = '';
  for (let r = 0; r < MS_ROWS; r++) {
    for (let c = 0; c < MS_COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'ms-cell';
      cell.setAttribute('data-r', r);
      cell.setAttribute('data-c', c);
      cell.addEventListener('click', () => msReveal(r, c));
      cell.addEventListener('contextmenu', (e) => { e.preventDefault(); msToggleFlag(r, c); });
      // 移动端：长按标记（touchstart 里 preventDefault，掐掉合成 click / contextmenu / 双击缩放）
      cell.addEventListener('touchstart', (e) => msTouchStart(e, r, c), { passive: false });
      cell.addEventListener('touchmove', msTouchMove);
      cell.addEventListener('touchend', (e) => msTouchEnd(e, r, c));
      cell.addEventListener('touchcancel', msTouchCancel);
      board.appendChild(cell);
    }
  }
}

// ---- 移动端长按标记可疑地雷 ----
function msTouchStart(e, r, c) {
  if (e.touches.length > 1) { // 多指手势不接管
    msTouchActive = false;
    clearTimeout(msTouchTimer); msTouchTimer = null;
    return;
  }
  e.preventDefault(); // 阻止合成 click、contextmenu、双击缩放与 iOS 长按菜单
  const t = e.touches[0];
  msTouchActive = true;
  msTouchStartX = t.clientX; msTouchStartY = t.clientY;
  msTouchLongFired = false;
  clearTimeout(msTouchTimer);
  msTouchTimer = setTimeout(() => {
    msTouchTimer = null;
    msTouchLongFired = true;
    msToggleFlag(r, c);
    if (navigator.vibrate) navigator.vibrate(30);
  }, MS_LONG_PRESS);
}
function msTouchMove(e) {
  if (msTouchTimer === null) return;
  const t = e.touches[0];
  if (!t) return;
  if (Math.abs(t.clientX - msTouchStartX) > MS_TOUCH_SLOP || Math.abs(t.clientY - msTouchStartY) > MS_TOUCH_SLOP) {
    clearTimeout(msTouchTimer); msTouchTimer = null; // 手指滑走，取消长按
  }
}
function msTouchEnd(e, r, c) {
  clearTimeout(msTouchTimer); msTouchTimer = null;
  if (!msTouchActive) return; // 多指手势之后的手抬起，忽略
  msTouchActive = false;
  if (msTouchLongFired) { msTouchLongFired = false; return; } // 长按已插旗，不再翻开
  const t = e.changedTouches && e.changedTouches[0];
  if (t && (Math.abs(t.clientX - msTouchStartX) > MS_TOUCH_SLOP || Math.abs(t.clientY - msTouchStartY) > MS_TOUCH_SLOP)) return; // 滑动，不翻开
  msReveal(r, c);
}
function msTouchCancel() {
  clearTimeout(msTouchTimer); msTouchTimer = null;
  msTouchLongFired = false; msTouchActive = false;
}
function msPlaceMines(safeR, safeC) {
  msMineCount = 3 + Math.floor(Math.random() * 3); // 3~5
  const candidates = [];
  for (let r = 0; r < MS_ROWS; r++) {
    for (let c = 0; c < MS_COLS; c++) {
      if (r === safeR && c === safeC) continue;
      if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
      candidates.push([r, c]);
    }
  }
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = candidates[i]; candidates[i] = candidates[j]; candidates[j] = tmp;
  }
  for (let k = 0; k < msMineCount && k < candidates.length; k++) {
    msMines[candidates[k][0]][candidates[k][1]] = true;
  }
}
function msAdjacent(r, c) {
  let n = 0;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < MS_ROWS && nc >= 0 && nc < MS_COLS && msMines[nr][nc]) n++;
  }
  return n;
}
function renderMsCell(r, c) {
  const cell = document.querySelector('#ms-board .ms-cell[data-r="' + r + '"][data-c="' + c + '"]');
  if (!cell) return;
  cell.textContent = '';
  cell.className = 'ms-cell';
  if (msRevealed[r][c]) {
    cell.classList.add('revealed');
    if (msMines[r][c]) {
      cell.classList.add('mine');
      cell.textContent = '✱';
    } else {
      const n = msAdjacent(r, c);
      if (n > 0) { cell.classList.add('n' + n); cell.textContent = n; }
    }
  } else if (msFlags[r][c]) {
    cell.classList.add('flag');
    cell.textContent = '⚑';
  }
}
function msToggleFlag(r, c) {
  if (msDead) return;                // 踩雷后不可再插旗
  if (msRevealed[r][c]) return;
  msFlags[r][c] = !msFlags[r][c];
  renderMsCell(r, c);
  playSound('click');
}
function msFlood(r, c) {
  if (r < 0 || r >= MS_ROWS || c < 0 || c >= MS_COLS) return;
  if (msRevealed[r][c] || msFlags[r][c]) return;
  msRevealed[r][c] = true;
  msRevealCount++;
  renderMsCell(r, c);
  if (msAdjacent(r, c) === 0) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      msFlood(r + dr, c + dc);
    }
  }
}
function revealAllMines() {
  for (let r = 0; r < MS_ROWS; r++) for (let c = 0; c < MS_COLS; c++) {
    if (msMines[r][c]) { msRevealed[r][c] = true; renderMsCell(r, c); }
  }
}
function msReveal(r, c) {
  if (msDead) return;                              // 本轮已踩雷：重开流程走完之前不响应
  if (msRevealed[r][c] || msFlags[r][c]) return;
  if (msFirst) { msFirst = false; msPlaceMines(r, c); }
  if (msMines[r][c]) {
    msDead = true;
    msRevealed[r][c] = true;
    renderMsCell(r, c);
    revealAllMines();
    playSound('error');
    // 先让玩家看清踩雷后的盘面：这 1 秒里 #dialog-lock 已锁住整个界面
    // （含关闭按钮、窗口外区域与提示按钮），盘面只可见不可点
    document.getElementById('dialog-lock').classList.add('show');
    clearTimeout(msRestartTimer);
    msRestartTimer = setTimeout(msRestartAfterDeath, 1000);
    return;
  }
  msFlood(r, c);
  if (msCheckWin()) msWin();
}
// 踩雷 1 秒后：重建全新盘面，并弹出提示。提示被点掉之前，新盘面不可游玩
function msRestartAfterDeath() {
  openMinesweeper();                 // 重建新盘面（同时把 msDead 复位）
  msDead = true;                     // 但重开流程还没走完：重新封住，直到提示被点掉
  showCompletionBubble('踩到地雷了！再来一次吧。', function () {
    msDead = false;                  // 玩家点掉提示 → 新盘面开始游玩
  });
}
function msCheckWin() {
  return msRevealCount >= (MS_ROWS * MS_COLS - msMineCount);
}
function msWin() {
  if (state.minesweeperComplete) return;
  state.minesweeperComplete = true;
  playSound('success');
  // 意见7：扫雷完成立刻获得物品
  removeItem('password-slip');
  addItem('postcard');
  playSound('collect');
  addItem('stamp');
  playSound('collect');
  // 意见3：完成提示为对话气泡（参照NPC1对话），全局显示，点击后退出至 roomC
  clearTimeout(msRestartTimer);
  showCompletionBubble('游戏完成！获得物品"明信片"和"印章"', function () {
    closeModal();
    showDialog('拿着印章和明信片找工作人员吧！');
  });
}

// ============================================================
// NPC 交互
// ============================================================
function onItemClick(itemId) {
  if (itemId === 'password-slip') {
    playSound('click');
    openModal('slip');
  }
}

// NPC1：对话 + 拖放收件（明信片/印章）
function onNpc1Click() {
  playSound('click');
  if (state.gameWon) { showDialog('盖好了！'); return; }
  if (!state.firstDialogDone) {
    state.firstDialogDone = true;
    showDialog('新装的数字展览装置突然坏掉了，要修好才能看哦。');
    updateNavVisibility();
    return;
  }
  if (state.postcardDropped && state.stampDropped) { showDialog('盖好了！'); return; }
  if (state.postcardDropped || state.stampDropped) { showDialog('要两样都给我才行哦。'); return; }
  if (getCount('postcard') > 0 && getCount('stamp') > 0) {
    showDialog('你居然找到了，把它们给我吧，我来给你盖章');
    return;
  }
  showDialog('新装的数字展览装置突然坏掉了，要修好才能看哦。');
}

function onNpc2Click() { playSound('click'); openModal('npc2'); }
function onNpc3Click() { playSound('click'); openModal('npc3'); }
function onNpc4Enter() {
  npc4Hovered = true;
  document.getElementById('entity-npc4').style.backgroundImage = "url('images/npc-4b.png')";
}
function onNpc4Leave() {
  npc4Hovered = false;
  document.getElementById('entity-npc4').style.backgroundImage = "url('images/npc-4a.png')";
}
function onNpc5Click() {
  playSound('click');
  // 意见7：扫雷完成后 NPC5 不再显示密码栏与数字键盘
  if (state.minesweeperComplete) { openModal('empty'); return; }
  openModal('npc5');
}
function onNpc6Click() { playSound('click'); openModal('npc6'); }
function onNpc7Click() { playSound('click'); openModal('npc7'); }
let npc4Hovered = false;

// ============================================================
// 拖放处理（物品 → NPC1）
// ============================================================
function handleDrop(itemId, target, el) {
  if (target === 'npc1') {
    if (state.gameWon) return;
    if (itemId === 'postcard' && !state.postcardDropped) {
      removeItem('postcard');
      state.postcardDropped = true;
      playSound('collect');
    } else if (itemId === 'stamp' && !state.stampDropped) {
      removeItem('stamp');
      state.stampDropped = true;
      playSound('collect');
    } else {
      return;
    }
    if (state.postcardDropped && state.stampDropped) giveToNpc1Complete();
  }
}
function giveToNpc1Complete() {
  if (state.gameWon) return;
  state.gameWon = true;
  // "盖好了！"对话框点击消失后，再出现获得通关道具的窗口
  showDialogPersistent('盖好了！', () => {
    showPickupModal('stamped-postcard', '盖章明信片');
  });
}

// ============================================================
// 初始化（§6.9）
// ============================================================
function bindUI() {
  const npc4 = document.getElementById('entity-npc4');
  npc4.addEventListener('mouseenter', onNpc4Enter);
  npc4.addEventListener('mouseleave', onNpc4Leave);
  document.getElementById('landscape-hint').addEventListener('click', function (e) { if (e.target === e.currentTarget) dismissLandscapeHint(); });
  document.getElementById('landscape-hint-close').addEventListener('click', dismissLandscapeHint);
}
function initGame() {
  loadSettings();
  updateNavVisibility();
  renderInventory();
  renderBackpack();
  bindUI();
  // 统一：对话框不自动消失，点击对话框范围区域后才关闭；显示期间锁定游戏界面
  document.getElementById('dialog-box').addEventListener('click', function () {
    const cb = dialogClickCallback;
    dialogClickCallback = null;
    hideDialog();
    if (cb) cb();
  });
  const startBgmOnInteract = () => {
    if (musicVolume > 0.01) startBgm();
    document.removeEventListener('click', startBgmOnInteract);
  };
  document.addEventListener('click', startBgmOnInteract);
  console.log('🎮 西水博物馆 — 点击解密点触解谜 Demo（Rusty Lake 风）');
}
window.addEventListener('DOMContentLoaded', initGame);
</script>
