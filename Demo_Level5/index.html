<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>活力缤纷大铁柱</title>
<style>
/* ============================================================
   GAME-TEMPLATE.md CSS — 不可变部分
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0a; overflow: hidden;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  width: 100vw; height: 100vh;
  user-select: none; -webkit-user-select: none;
}
#game-container {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); transform-origin: center center;
  width: 1280px; height: 720px;
  background: #222; overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  display: flex; flex-direction: row;
}
#room-area {
  width: 1120px; height: 720px; flex-shrink: 0;
  position: relative; overflow: hidden; background: #444;
}
#ui-inventory {
  width: 160px; height: 720px; flex-shrink: 0;
  background-image: url('images/ui-inventory-bg.png'); background-size: cover;
  border-left: 2px solid #000;
  display: flex; flex-direction: column; align-items: center;
  padding: 15px 0; gap: 15px;
  overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
}
#ui-inventory::-webkit-scrollbar { display: none; }

/* 房间系统 */
.room {
  display: none; position: absolute; top: 0; left: 0;
  width: 1120px; height: 720px;
  background-size: cover; background-position: center; background-repeat: no-repeat;
}
.room.active-room { display: block; }
#room-A { background-image: url('images/room-A-bg.png'); }
#room-B { background-image: url('images/room-B-bg.png'); }
#room-C { background-image: url('images/room-C-bg.png'); }
#room-D { background-image: url('images/room-D-bg.png'); }
#room-E { background-image: url('images/room-E-bg.png'); }

/* 实体基类 */
.entity {
  position: absolute;
  background-size: contain; background-repeat: no-repeat; background-position: center;
}
.clickable { transition: filter 0.2s, transform 0.2s; }
.clickable:hover { filter: brightness(1.2); }

/* 对话框 */
#dialog-box {
  position: absolute; bottom: 40px; left: 160px;
  width: 800px; min-height: 70px;
  background: rgba(255,255,255,0.95); border: 3px solid #333; border-radius: 15px;
  color: #000; font-size: 20px; line-height: 1.7;
  padding: 20px; z-index: 10001; display: none;
  text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
#dialog-box.visible { display: block; animation: dialogIn 0.35s ease-out; }
@keyframes dialogIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* 对话框模态锁：对话框显示期间锁定整个游戏界面，仅对话框本身可点击 */
#dialog-lock {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10000; display: none;
}
#dialog-lock.show { display: block; }

/* 导航按钮 */
.nav-btn {
  position: absolute; top: 335px;
  width: 50px; height: 60px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  z-index: 150; opacity: 0.7; transition: opacity 0.3s, transform 0.2s; display: none;
}
.nav-btn:hover { filter: brightness(1.2); }
.nav-btn.visible { display: block; }
#nav-left  { left: 12px;  background-image: url('images/nav-left.png'); }
#nav-right { right: 12px; background-image: url('images/nav-right.png'); }

/* 物品栏 */
.inv-slot { width: 120px; height: 120px; background: rgba(0,0,0,0.3); border: 2px solid #333;
  border-radius: 5px; flex-shrink: 0; position: relative;
  display: flex; align-items: center; justify-content: center; }
.inv-slot:empty { border-style: dashed; }
.inv-item {
  width: 100%; height: 100%;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  border-radius: 3px;
}
.inv-count {
  position: absolute; bottom: 5px; right: 8px;
  background: rgba(0,0,0,0.7); color: #ffd700;
  font-size: 14px; font-weight: bold;
  padding: 1px 6px; border-radius: 8px; pointer-events: none;
}

/* 设置按钮 */
#settings-btn {
  position: absolute;
  top: 12px; right: 172px;
  width: 42px; height: 42px;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-radius: 50%;
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#settings-btn:hover {
  background: rgba(0, 0, 0, 0.75);
  border-color: rgba(255, 255, 255, 0.6);
  transform: rotate(30deg);
}
#settings-btn svg {
  width: 24px; height: 24px;
  fill: rgba(255, 255, 255, 0.85);
}

/* 设置覆盖层 */
#settings-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
}
#settings-overlay.show {
  display: flex;
}

#settings-panel {
  position: relative;
  width: 400px;
  background: rgba(20, 20, 30, 0.92);
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 16px;
  padding: 32px 36px 28px;
  color: #e0e0e0;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  pointer-events: auto;
  box-sizing: border-box;
}
#settings-panel h3 {
  text-align: center;
  margin-bottom: 24px;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 2px;
  color: #fff;
}

/* Close button */
#settings-close-btn {
  position: absolute;
  top: 10px; right: 16px;
  width: 32px; height: 32px;
  background: none;
  border: none;
  color: #999;
  font-size: 24px;
  transition: color 0.2s;
  line-height: 32px;
  text-align: center;
  padding: 0;
}
#settings-close-btn:hover { color: #fff; }

/* Volume row */
.setting-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.vol-icon {
  width: 22px; height: 22px;
  opacity: 0.7;
  flex-shrink: 0;
}
.vol-label {
  width: 56px;
  text-align: right;
  font-size: 15px;
  color: #bbb;
  flex-shrink: 0;
}

/* Custom range slider */
.setting-row input[type="range"] {
  flex: 1;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 3px;
  outline: none;
}
.setting-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #888;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  transition: transform 0.15s ease;
}
.setting-row input[type="range"]::-webkit-slider-thumb:hover {
  filter: brightness(1.2);
}
.setting-row input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #888;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}
.setting-row input[type="range"]::-moz-range-thumb:hover {
  filter: brightness(1.2);
}
.vol-value {
  width: 36px;
  text-align: center;
  font-size: 14px;
  color: #aaa;
  flex-shrink: 0;
}

/* External link button */
#settings-link-btn {
  width: 100%;
  margin-top: 24px;
  padding: 12px 0;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 10px;
  color: #ddd;
  font-size: 16px;
  letter-spacing: 1px;
  text-align: center;
  transition: all 0.2s ease;
}
#settings-link-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.45);
  color: #fff;
}

/* 背包按钮 */
#backpack-btn {
  position: absolute;
  top: 12px; right: 222px;
  width: 42px; height: 42px;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-radius: 50%;
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#backpack-btn:hover {
  background: rgba(0, 0, 0, 0.75);
  border-color: rgba(255, 255, 255, 0.6);
}
#backpack-btn svg {
  width: 24px; height: 24px;
  fill: rgba(255, 255, 255, 0.85);
}

/* 背包覆盖层 */
#backpack-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
}
#backpack-overlay.show { display: flex; }

#backpack-panel {
  position: relative;
  width: 340px;
  background: rgba(20, 20, 30, 0.92);
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-radius: 16px;
  padding: 32px 28px 28px;
  color: #e0e0e0;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  pointer-events: auto;
  box-sizing: border-box;
}
#backpack-panel h3 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 2px;
  color: #fff;
}

#backpack-close-btn {
  position: absolute;
  top: 10px; right: 16px;
  width: 32px; height: 32px;
  background: none;
  border: none;
  color: #999;
  font-size: 24px;
  transition: color 0.2s;
  line-height: 32px;
  text-align: center;
  padding: 0;
}
#backpack-close-btn:hover { color: #fff; }

/* 3x3 backpack grid */
#backpack-grid {
  display: grid;
  grid-template-columns: repeat(3, 84px);
  grid-template-rows: repeat(3, 84px);
  gap: 10px;
  justify-content: center;
}

.bp-slot {
  width: 84px; height: 84px;
  background: rgba(0, 0, 0, 0.35);
  border: 2px dashed #444;
  border-radius: 6px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bp-item {
  width: 100%; height: 100%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* 自定义鼠标指针系统 */
#game-container { cursor: url('images/cursor-default.png') 2 2, auto; }
.inv-item { cursor: url('images/cursor-grab.png') 16 16, grab; }
/* 统一：原生控件（<button>、滑块等）不继承自定义指针，这里显式指定 */
button, input[type="range"] { cursor: url('images/cursor-default.png') 2 2, auto; }
html.dragging, body.dragging, body.dragging * { cursor: none !important; }
#drag-cursor-follower {
  position: fixed; pointer-events: none; z-index: 99999;
  width: 32px; height: 32px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  transform: translate(-16px, -16px);
}
body.dragging .drag-over-target { filter: brightness(1.3) drop-shadow(0 0 6px cyan); }

/* ============================================================
   游戏专属 CSS
   ============================================================ */

/* 塔身 */
.tower-body {
  position: absolute;
  left: 310px; top: 0;
  width: 500px; height: 330px;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  border-radius: 8px;
  transition: background-image 0.3s ease;
  z-index: 50;
}
#room-B .tower-body { background-image: url('images/tower.png'); }
#room-C .tower-body { background-image: url('images/tower.png'); }
#room-D .tower-body { background-image: url('images/tower.png'); }
#room-E .tower-body { background-image: url('images/tower.png'); }
/* 塔闪白 (B-D) */
@keyframes flashWhite {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(2.5); }
}
.tower-body.flash-white { animation: flashWhite 1s ease-in-out; }

/* 塔变黑 (E) */
@keyframes flashBlack {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(0.2); }
}
.tower-body.flash-black { animation: flashBlack 1s ease-in-out; }

/* 石墩子 (彩色游戏柱) */
.pillar {
  position: absolute;
  top: 540px;
  width: 130px; height: 130px;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  border-radius: 8px 8px 4px 4px;
  transition: filter 0.15s, transform 0.15s, box-shadow 0.15s;
  z-index: 60;
}
.pillar:hover { filter: brightness(1.3); }
.pillar:active { }
.pillar.disabled { pointer-events: none; opacity: 0.6; }

.pillar-red    { left: 160px; background-image: url('images/pillar-red.png'); }
.pillar-yellow { left: 336px; background-image: url('images/pillar-yellow.png'); }
.pillar-blue   { left: 512px; background-image: url('images/pillar-blue.png'); }
.pillar-green  { left: 688px; background-image: url('images/pillar-green.png'); }
.pillar-purple { left: 864px; background-image: url('images/pillar-purple.png'); }

/* NPC1 — MJ 主播 */
#entity-mj {
  border-radius: 8px;
  z-index: 55;
}
.npc-chaos {
  left: 420px; top: 300px;
  width: 280px; height: 400px;
  background-image: url('images/npc-mj-chaos.png');
}
.npc-calm {
  left: 400px; top: 260px;
  width: 336px; height: 480px;
  background-image: url('images/npc-mj-calm.png');
}

/* NPC2 — 灰色路障石墩 */
.entity-grey-pillar {
  left: 50px; top: 580px;
  width: 105px; height: 135px;
  background-image: url('images/npc-pillar.png');
  border-radius: 4px;
  z-index: 55;
}

/* 灰色气泡提示 */
.grey-bubble {
  position: absolute;
  left: 70px; top: 505px;
  background: #3a3a3a;
  color: #ddd;
  font-size: 14px;
  padding: 10px 14px;
  border-radius: 10px;
  max-width: 200px;
  text-align: center;
  z-index: 65;
  display: none;
  box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  line-height: 1.5;
}
.grey-bubble.visible { display: block; }
.grey-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 22px;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid #3a3a3a;
}

/* 道具拾取弹窗 */
#pickup-overlay {
  position: absolute; top: 0; left: 0;
  width: 1120px; height: 720px;
  background: rgba(0,0,0,0.7); z-index: 350; display: none;
  align-items: center; justify-content: center;
}
#pickup-overlay.visible { display: flex; }
#pickup-panel {
  background: #1a1a2e; border: 2px solid #555; border-radius: 16px;
  padding: 30px 40px; width: 300px; color: #fff;
  text-align: center;
}
#pickup-panel h3 { margin-bottom: 20px; font-size: 20px; letter-spacing: 2px; }
#pickup-item-img {
  width: 100px; height: 100px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  margin: 0 auto 12px;
}
#pickup-item-name { font-size: 16px; color: #ccc; margin-bottom: 24px; }
#pickup-confirm-btn {
  padding: 10px 40px;
  background: #8b5cf6; border: none; border-radius: 8px;
  color: #fff; font-size: 15px; cursor: url('images/cursor-default.png') 2 2, auto; letter-spacing: 2px;
}
#pickup-confirm-btn:hover { background: #7c3aed; }

/* === 横屏提示遮罩 === */
#landscape-hint {
  position: fixed; inset: 0;
  background: #0a0a0a;
  z-index: 100000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  color: #fff;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  text-align: center;
  user-select: none; -webkit-user-select: none;
}
#landscape-hint.show { display: flex; }
#landscape-hint-icon {
  width: 76px; height: 76px;
  animation: hintLockPulse 1.8s ease-in-out infinite;
}
@keyframes hintLockPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
#landscape-hint p { font-size: 18px; letter-spacing: 2px; opacity: 0.85; }
#landscape-hint .hint-sub { font-size: 13px; opacity: 0.5; letter-spacing: 1px; }
#landscape-hint-close {
  margin-top: 8px;
  padding: 10px 40px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 24px;
  color: #ddd;
  font-size: 15px;
  letter-spacing: 2px;
  cursor: url('images/cursor-default.png') 2 2, auto;
  transition: background 0.2s, color 0.2s;
}
#landscape-hint-close:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

#return-btn {
  position: absolute;
  top: 12px; left: 12px;
  width: 42px; height: 42px;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-radius: 50%;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#return-btn:hover { background: rgba(0, 0, 0, 0.75); border-color: rgba(255, 255, 255, 0.6); }
#return-btn svg { width: 24px; height: 24px; fill: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>

<!-- 音频 -->
<audio id="bgm" src="audio/bgm.mp3" loop preload="none"></audio>
<audio id="sfx-click" src="audio/sfx-click.mp3" preload="auto"></audio>
<audio id="sfx-nav" src="audio/sfx-nav.mp3" preload="auto"></audio>
<audio id="sfx-success" src="audio/sfx-success.mp3" preload="auto"></audio>
<audio id="sfx-fail" src="audio/sfx-fail.mp3" preload="auto"></audio>
<audio id="sfx-dialog" src="audio/sfx-dialog.mp3" preload="auto"></audio>
<audio id="sfx-collect" src="audio/sfx-collect.mp3" preload="auto"></audio>
<audio id="sfx-color-red"    src="audio/sfx-color-red.mp3"    preload="auto"></audio>
<audio id="sfx-color-yellow" src="audio/sfx-color-yellow.mp3" preload="auto"></audio>
<audio id="sfx-color-blue"   src="audio/sfx-color-blue.mp3"   preload="auto"></audio>
<audio id="sfx-color-green"  src="audio/sfx-color-green.mp3"  preload="auto"></audio>
<audio id="sfx-color-purple" src="audio/sfx-color-purple.mp3" preload="auto"></audio>

<!-- 游戏容器 -->
<div id="game-container">

  <!-- 场景区域 -->
  <div id="room-area">

    <!-- ========== Room A: 塔前广场 ========== -->
    <div id="room-A" class="room active-room">
      <div id="entity-mj" class="entity clickable npc-chaos" data-drop-target="npc1" onclick="onClickNPC1()"></div>
    </div>

    <!-- ========== Room B: 塔底东面 ========== -->
    <div id="room-B" class="room">
<div id="tower-B" class="tower-body entity" data-drop-target="tower-B"></div>
      <div id="pillar-B-red"    class="pillar pillar-red    entity clickable" onclick="onClickPillar('B','red')"    data-color="red"></div>
      <div id="pillar-B-yellow" class="pillar pillar-yellow entity clickable" onclick="onClickPillar('B','yellow')" data-color="yellow"></div>
      <div id="pillar-B-blue"   class="pillar pillar-blue   entity clickable" onclick="onClickPillar('B','blue')"   data-color="blue"></div>
      <div id="pillar-B-green"  class="pillar pillar-green  entity clickable" onclick="onClickPillar('B','green')"  data-color="green"></div>
      <div id="pillar-B-purple" class="pillar pillar-purple entity clickable" onclick="onClickPillar('B','purple')" data-color="purple"></div>
      <div id="entity-grey-pillar-B" class="entity-grey-pillar entity clickable" onclick="onClickNPC2()"></div>
      <div id="grey-bubble-B" class="grey-bubble">点击右侧箭头前往广场的另一侧吧！</div>
    </div>

    <!-- ========== Room C: 塔底南面 ========== -->
    <div id="room-C" class="room">
      <div id="tower-C" class="tower-body entity" data-drop-target="tower-C"></div>
      <div id="pillar-C-red"    class="pillar pillar-red    entity clickable" onclick="onClickPillar('C','red')"    data-color="red"></div>
      <div id="pillar-C-yellow" class="pillar pillar-yellow entity clickable" onclick="onClickPillar('C','yellow')" data-color="yellow"></div>
      <div id="pillar-C-blue"   class="pillar pillar-blue   entity clickable" onclick="onClickPillar('C','blue')"   data-color="blue"></div>

<script>
// ============================================================
// ① 设备识别（必须放在 <script> 最顶部，先于 resizeGame()）
// 生成 window.deviceInfo，并给 <html> 打上 device-* 类
// ============================================================
(function detectDevice() {
  const ua = navigator.userAgent;

  // 系统
  const isIOS     = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isMac     = /Mac/i.test(ua) && !isIOS;
  const isWindows = /Windows/i.test(ua);

  // 设备形态
  const isTablet   = /iPad/i.test(ua) || (isAndroid && !/Mobile/i.test(ua));
  const isMobileUA = /Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  const isTouch    = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const coarsePtr  = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;
  const noHover    = window.matchMedia ? window.matchMedia('(hover: none)').matches : false;
  // 只有「主指针是粗指针且无悬停能力」才算触屏为主（手机/平板），
  // 避免把带触屏的桌面笔记本误判成移动端。
  const isTouchPrimary = coarsePtr && noHover;
  const isMobile   = isMobileUA || isTouchPrimary;

  // 浏览器
  const isWeChat  = /MicroMessenger/i.test(ua);
  const isQQ      = /QQ\//i.test(ua);
  const isSafari  = /Safari/i.test(ua) && !/Chrome|CriOS|Edg|OPR/i.test(ua);
  const isChrome  = /Chrome|CriOS/i.test(ua) && !/Edg|OPR/i.test(ua);
  const isEdge    = /Edg/i.test(ua);
  const isFirefox = /Firefox/i.test(ua);

  const isPortrait = window.matchMedia
    ? window.matchMedia('(orientation: portrait)').matches
    : window.innerHeight > window.innerWidth;

  window.deviceInfo = {
    isMobile, isTablet, isMobileDevice: isMobile || isTablet, isDesktop: !isMobile && !isTablet,
    isTouch, isIOS, isAndroid, isMac, isWindows,
    isWeChat, isQQ, isSafari, isChrome, isEdge, isFirefox,
    isPortrait, isLandscape: !isPortrait,
    os: isIOS ? 'ios' : isAndroid ? 'android' : isWindows ? 'windows' : isMac ? 'mac' : 'other',
    browser: isWeChat ? 'wechat' : isQQ ? 'qq' : isSafari ? 'safari'
           : isEdge ? 'edge' : isFirefox ? 'firefox' : isChrome ? 'chrome' : 'other',
    type: isMobile ? 'mobile' : isTablet ? 'tablet' : 'desktop'
  };

  const root = document.documentElement;
  root.classList.add('device-' + deviceInfo.type);
  root.setAttribute('data-device', deviceInfo.type);
  if (deviceInfo.isTouch)     root.classList.add('device-touch');
  if (deviceInfo.isIOS)       root.classList.add('device-ios');
  if (deviceInfo.isAndroid)   root.classList.add('device-android');
  if (deviceInfo.isWeChat)    root.classList.add('device-wechat');
  if (deviceInfo.isPortrait)  root.classList.add('device-portrait');
  else                        root.classList.add('device-landscape');

  console.log('📱 设备识别:', deviceInfo);
})();

// ============================================================
// ② 画布缩放 + 移动端强制横屏（必须放在设备识别之后）
// ============================================================
function resizeGame() {
  const gc = document.getElementById('game-container');
  // 移动端竖屏时旋转 90° 强制横屏（微信等不跟随设备方向的 webview 也能横屏）
  const rotated = deviceInfo.isMobileDevice && deviceInfo.isPortrait;
  let s;
  if (rotated) {
    // 旋转后宽高互换：游戏宽 1280 → 视口高，游戏高 720 → 视口宽
    s = Math.min(window.innerHeight / 1280, window.innerWidth / 720);
    gc.style.transform = `translate(-50%, -50%) rotate(90deg) scale(${s})`;
  } else {
    s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    gc.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  gc.classList.toggle('rotated', rotated);
}
window.addEventListener('resize', resizeGame);
resizeGame();

// ============================================================
// ③ 方向监听 + 横屏锁屏提示（一次性、可关闭、6 秒自动消失）
// ============================================================
let landscapeHintDismissed = false;
let landscapeHintTimer = null;

// 以「实际 viewport 是否横屏」为准，而非按 app 类型判断：
// 微信/QQ 等不响应旋屏的内置浏览器会一直停在竖屏，isLandscape 恒为 false，自然不触发提示。
function updateLandscapeHint() {
  const hint = document.getElementById('landscape-hint');
  if (!hint) return;
  const shouldShow = deviceInfo.isMobileDevice && deviceInfo.isLandscape && !landscapeHintDismissed;
  if (shouldShow && !hint.classList.contains('show')) {
    hint.classList.add('show');
    if (landscapeHintTimer) clearTimeout(landscapeHintTimer);
    landscapeHintTimer = setTimeout(dismissLandscapeHint, 6000);
  } else if (!shouldShow) {
    hint.classList.remove('show');
  }
}

function dismissLandscapeHint() {
  landscapeHintDismissed = true;
  if (landscapeHintTimer) { clearTimeout(landscapeHintTimer); landscapeHintTimer = null; }
  const hint = document.getElementById('landscape-hint');
  if (hint) hint.classList.remove('show');
}

function updateOrientation() {
  const isPortrait = window.matchMedia
    ? window.matchMedia('(orientation: portrait)').matches
    : (window.innerHeight > window.innerWidth);

  deviceInfo.isPortrait = isPortrait;
  deviceInfo.isLandscape = !isPortrait;
  const root = document.documentElement;
  root.classList.toggle('device-portrait', isPortrait);
  root.classList.toggle('device-landscape', !isPortrait);

  resizeGame(); // 方向变化后重算缩放/旋转
  updateLandscapeHint();
}
window.addEventListener('resize', updateOrientation);
window.addEventListener('orientationchange', updateOrientation);
if (window.screen && screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', updateOrientation);
}
updateOrientation();

// ============================================================
// 颜色映射
// ============================================================
const COLORS = ['red', 'yellow', 'blue', 'green', 'purple'];
const COLOR_NAME_CN = {
  red: '红', yellow: '黄', blue: '蓝', green: '绿', purple: '紫'
};
const ROOM_SEQUENCE_LENGTH = { B: 2, C: 3, D: 4, E: 5 };
const rooms = ['A', 'B', 'C', 'D', 'E'];
const STORAGE_PREFIX = 'irontower_';
// 音量设置在所有关卡间共用（与 Demo_Level0 同一对键）
const VOLUME_PREFIX = 'linkgame_';

// ============================================================
// 全局状态
// ============================================================
const state = {
  inventory: [],            // [{id: string, count: number}]
  backpack: [],             // 背包物品 id 数组 (max 9)
  currentRoomIndex: 0,      // 当前房间索引
  npc1DialogStep: 0,
  npc1FinalDialogDone: false,
  hasGlasses: false,
  // 各房间谜题状态
  puzzles: {
    B: { colorSequence: [], playerSequence: [], showing: false, solved: false },
    C: { colorSequence: [], playerSequence: [], showing: false, solved: false },
    D: { colorSequence: [], playerSequence: [], showing: false, solved: false },
    E: { colorSequence: [], playerSequence: [], showing: false, solved: false }
  }
};

let musicVolume = 0.7;
let sfxVolume = 0.8;
let audioCtx = null;
let dialogTimer = null;
let currentColorAudio = null;
let pendingPickupItem = null;

// ============================================================
// 颜色音效系统 (可停止)
// ============================================================
function playColorSound(color) {
  stopColorSound();
  const audioEl = document.getElementById('sfx-color-' + color);
  if (audioEl && audioEl.getAttribute('src') && audioEl.getAttribute('src') !== '') {
    try {
      const clone = audioEl.cloneNode();
      clone.volume = sfxVolume;
      clone.play().catch(() => {});
      currentColorAudio = clone;
      return;
    } catch(e) { /* fall through to synthesis */ }
  }
  // 回退: Web Audio 合成 — 不同颜色不同频率
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const freqMap = { red: 262, yellow: 330, blue: 392, green: 523, purple: 659 };
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freqMap[color] || 440, now);
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(sfxVolume * 0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.3);
    currentColorAudio = { stop: () => { try { osc.stop(0); } catch(e) {} } };
  } catch(e) { /* 音频不可用时静默 */ }
}

function stopColorSound() {
  if (currentColorAudio) {
    try {
      if (typeof currentColorAudio.stop === 'function') {
        currentColorAudio.stop();
      } else {
        currentColorAudio.pause();
        currentColorAudio.currentTime = 0;
      }
    } catch(e) { /* ignore */ }
    currentColorAudio = null;
  }
}

// ============================================================
// 音频系统
// ============================================================
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(type) {
  // 先尝试 HTML audio 标签
  const audioEl = document.getElementById('sfx-' + type);
  if (audioEl && audioEl.getAttribute('src') && audioEl.getAttribute('src') !== '') {
    try {
      const clone = audioEl.cloneNode();
      clone.volume = sfxVolume;
      clone.play().catch(() => {});
      return;
    } catch(e) { /* fall through to synthesis */ }
  }
  // 回退: Web Audio 合成
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(sfxVolume * 0.5, now);

    switch(type) {
      case 'click': {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.06);
        osc.connect(gain);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
        break;
      }
      case 'nav': {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        osc.connect(gain);
        gain.gain.setValueAtTime(sfxVolume * 0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
        break;
      }
      case 'success': {
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          const t = now + i * 0.15;
          osc.frequency.setValueAtTime(freq, t);
          const g = ctx.createGain();
          g.connect(ctx.destination);
          g.gain.setValueAtTime(sfxVolume * 0.3, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.connect(g);
          osc.start(t); osc.stop(t + 0.3);
        });
        break;
      }
      case 'fail': {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
        osc.connect(gain);
        gain.gain.setValueAtTime(sfxVolume * 0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
        break;
      }
      case 'dialog': {
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
        osc.connect(gain);
        gain.gain.setValueAtTime(sfxVolume * 0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
        break;
      }
      case 'collect': {
        [587.33, 783.99, 1174.66].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          const t = now + i * 0.1;
          osc.frequency.setValueAtTime(freq, t);
          const g = ctx.createGain();
          g.connect(ctx.destination);
          g.gain.setValueAtTime(sfxVolume * 0.25, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(g);
          osc.start(t); osc.stop(t + 0.35);
        });
        break;
      }
    }
  } catch(e) {
    // 音频不可用时静默
  }
}

function startBgm() {
  const bgmEl = document.getElementById('bgm');
  if (bgmEl && bgmEl.getAttribute('src') && bgmEl.getAttribute('src') !== '') {
    bgmEl.volume = musicVolume;
    bgmEl.play().catch(() => {});
  }
}

function showDialog(text) {
  const box = document.getElementById('dialog-box');
  if (dialogTimer) clearTimeout(dialogTimer);
  box.textContent = text;
  box.classList.add('visible');
  playSound('dialog');
  // 统一：对话框不自动消失，点击对话框范围区域后才关闭；显示期间锁定游戏界面
  document.getElementById('dialog-lock').classList.add('show');
}
// 持久对话框：点击对话框消失后再执行回调（用于两句连续对话 / 对话框消失后再弹窗口）
let dialogClickCallback = null;
function showDialogPersistent(text, callback) {
  const box = document.getElementById('dialog-box');
  if (dialogTimer) clearTimeout(dialogTimer);
  box.textContent = text;
  box.classList.add('visible');
  box.style.cursor = "url('images/cursor-default.png') 2 2, auto";
  playSound('dialog');
  document.getElementById('dialog-lock').classList.add('show');
  dialogClickCallback = callback || null;
}

function hideDialog() {
  const box = document.getElementById('dialog-box');
  box.classList.remove('visible');
  if (dialogTimer) { clearTimeout(dialogTimer); dialogTimer = null; }
  dialogClickCallback = null;
  document.getElementById('dialog-lock').classList.remove('show');
}

// ============================================================
// 房间导航
// ============================================================
function changeRoom(dir) {
  let newIdx = state.currentRoomIndex + dir;
  // 从 E 往右回到 A 的循环
  if (newIdx >= rooms.length) newIdx = 0;
  if (newIdx < 0) newIdx = rooms.length - 1;
  if (newIdx === state.currentRoomIndex) return;

  const allowed = canNavigateTo(newIdx, dir);
  if (!allowed) return;

  hideDialog();
  stopColorSound();

  // 离开当前房间时重置输入进度（保留求解状态和颜色序列）
  if (dir !== 0) {
    const curLetter = rooms[state.currentRoomIndex];
    if (state.puzzles[curLetter] && !state.puzzles[curLetter].solved) {
      state.puzzles[curLetter].playerSequence = [];
    }
  }

  // 切换房间
  const oldRoom = document.getElementById('room-' + rooms[state.currentRoomIndex]);
  oldRoom.classList.remove('active-room');
  state.currentRoomIndex = newIdx;
  const newRoom = document.getElementById('room-' + rooms[newIdx]);
  newRoom.classList.add('active-room');

  updateNavVisibility();
  updateRoomVisuals();
  updateGreyBubbles();
  playSound('nav');
}

function canNavigateTo(newIdx, dir) {
  // 向左总是允许（除了在 A）
  if (dir === -1 && newIdx >= 0) return true;
  // 向右需要完成当前房间的条件
  if (dir === 1) {
    const curLetter = rooms[state.currentRoomIndex];
    if (curLetter === 'A') return state.npc1DialogStep >= 2;
    if (curLetter === 'B') return state.puzzles.B.solved;
    if (curLetter === 'C') return state.puzzles.C.solved;
    if (curLetter === 'D') return state.puzzles.D.solved;
    if (curLetter === 'E') return state.puzzles.E.solved; // 完成后回到 A
  }
  return true;
}

function updateNavVisibility() {
  const left = document.getElementById('nav-left');
  const right = document.getElementById('nav-right');

  // 左箭头
  if (state.currentRoomIndex > 0) {
    left.classList.add('visible');
  } else {
    left.classList.remove('visible');
  }

  // 右箭头
  const curLetter = rooms[state.currentRoomIndex];
  let showRight = false;
  if (curLetter === 'A') showRight = state.npc1DialogStep >= 2;
  else if (curLetter === 'B') showRight = state.puzzles.B.solved;
  else if (curLetter === 'C') showRight = state.puzzles.C.solved;
  else if (curLetter === 'D') showRight = state.puzzles.D.solved;
  else if (curLetter === 'E') showRight = state.puzzles.E.solved;

  if (showRight) {
    right.classList.add('visible');
  } else {
    right.classList.remove('visible');
  }
}

function updateRoomVisuals() {
  // 更新各房间塔和柱子的视觉状态
  ['B','C','D','E'].forEach(letter => {
    const towerEl = document.getElementById('tower-' + letter);
    if (!towerEl) return;
    const puzzle = state.puzzles[letter];
    const pillars = document.querySelectorAll('#room-' + letter + ' .pillar');

    if (puzzle.solved) {
      towerEl.classList.add('solved');
      towerEl.style.backgroundImage = "url('images/tower-solved.png')";
    } else {
      towerEl.classList.remove('solved');
      towerEl.style.backgroundImage = "url('images/tower.png')";
      pillars.forEach(p => p.classList.remove('disabled'));
    }
  });
}

function updateNPC1Sprite() {
  const allSolved = state.puzzles.B.solved && state.puzzles.C.solved &&
                    state.puzzles.D.solved && state.puzzles.E.solved;
  const npcEl = document.getElementById('entity-mj');
  if (!npcEl) return;
  if (allSolved) {
    npcEl.classList.remove('npc-chaos');
    npcEl.classList.add('npc-calm');
  } else {
    npcEl.classList.remove('npc-calm');
    npcEl.classList.add('npc-chaos');
  }
}

function updateGreyBubbles() {
  ['B','C','D','E'].forEach(letter => {
    const bubble = document.getElementById('grey-bubble-' + letter);
    if (bubble) bubble.classList.remove('visible');
  });

  const curLetter = rooms[state.currentRoomIndex];
  if (curLetter === 'A') return;

  if (state.puzzles[curLetter].solved) {
    const bubble = document.getElementById('grey-bubble-' + curLetter);
    if (bubble) bubble.classList.add('visible');
  }
}

// ============================================================
// 谜题引擎
// ============================================================
function generateColorSequence(length) {
  const seq = [];
  for (let i = 0; i < length; i++) {
    // 候选颜色：排除前一个颜色，确保相邻颜色不相同
    const prev = seq.length > 0 ? seq[seq.length - 1] : null;
    const candidates = prev ? COLORS.filter(c => c !== prev) : COLORS;
    seq.push(candidates[Math.floor(Math.random() * candidates.length)]);
  }
  return seq;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function activateTower(roomLetter) {
  const puzzle = state.puzzles[roomLetter];
  if (puzzle.showing || puzzle.solved) return;

  hideDialog();

  // 重置玩家进度
  puzzle.playerSequence = [];
  puzzle.showing = true;

  const towerEl = document.getElementById('tower-' + roomLetter);
  const baseImage = "url('images/tower.png')";

  // 显示颜色序列 — 通过图片切换实现变色
  for (const color of puzzle.colorSequence) {
    towerEl.style.backgroundImage = "url('images/tower-" + color + ".png')";
    playColorSound(color);
    await sleep(1000);
  }

  // 恢复塔的默认图片
  towerEl.style.backgroundImage = baseImage;
  puzzle.showing = false;
}

function onClickPillar(roomLetter, color) {
  const puzzle = state.puzzles[roomLetter];
  if (puzzle.showing || puzzle.solved) return;

  playColorSound(color);
  puzzle.playerSequence.push(color);
  const idx = puzzle.playerSequence.length - 1;

  // 视觉反馈：被点击的柱子短暂高亮
  const pillarEl = document.querySelector('#pillar-' + roomLetter + '-' + color);
  if (pillarEl) {
    pillarEl.style.filter = 'brightness(1.6)';
    setTimeout(() => { if (pillarEl) pillarEl.style.filter = ''; }, 200);
  }

  // 检查当前输入
  if (puzzle.colorSequence[idx] !== color) {
    // 错误！
    puzzle.playerSequence = [];
    puzzle.showing = true;
    playSound('fail');
    flashTowerFailure(roomLetter);
  } else if (puzzle.playerSequence.length === puzzle.colorSequence.length) {
    // 全部正确 — 解谜成功！
    puzzle.solved = true;
    const towerEl = document.getElementById('tower-' + roomLetter);
    towerEl.classList.add('solved');
    towerEl.style.backgroundImage = "url('images/tower-solved.png')";
    playSound('success');
    updateNavVisibility();
    updateNPC1Sprite();
    updateGreyBubbles();
    if (roomLetter === 'E') {
      document.getElementById('room-A').style.backgroundImage = "url('images/room-A-bg-solved.png')";
    }
  }
  // 部分正确：等待继续输入（不做额外反馈）
}

async function flashTowerFailure(roomLetter) {
  const towerEl = document.getElementById('tower-' + roomLetter);
  const isRoomE = roomLetter === 'E';

  // 移除旧的动画类
  towerEl.classList.remove('flash-white', 'flash-black');
  void towerEl.offsetWidth; // 强制回流

  if (isRoomE) {
    towerEl.classList.add('flash-black');
  } else {
    towerEl.classList.add('flash-white');
  }

  await sleep(1100);

  towerEl.classList.remove('flash-white', 'flash-black');
  state.puzzles[roomLetter].showing = false;
}

// 物品栏 API
// ============================================================
function addItem(id) {
  const existing = state.inventory.find(item => item.id === id);
  if (existing) {
    existing.count++;
  } else {
    state.inventory.push({ id: id, count: 1 });
  }
  renderInventory();
}

function removeItem(id, count) {
  const idx = state.inventory.findIndex(item => item.id === id);
  if (idx === -1) return;
  if (!count || state.inventory[idx].count <= count) {
    state.inventory.splice(idx, 1);
  } else {
    state.inventory[idx].count -= count;
  }
  renderInventory();
}

function renderInventory() {
  const inv = document.getElementById('ui-inventory');
  inv.innerHTML = '';
  state.inventory.forEach(item => {
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    const itemDiv = document.createElement('div');
    itemDiv.className = 'inv-item';
    itemDiv.setAttribute('data-item-id', item.id);
    itemDiv.style.backgroundImage = "url('images/item-" + item.id + ".png')";
    itemDiv.addEventListener('mousedown', startManualDrag);
    itemDiv.addEventListener('touchstart', touchStart, { passive: false });
    slot.appendChild(itemDiv);
    if (item.count > 1) {
      const badge = document.createElement('span');
      badge.className = 'inv-count';
      badge.textContent = item.count;
      slot.appendChild(badge);
    }
    inv.appendChild(slot);
  });
}

// ============================================================
// 拖拽系统 (GAME-TEMPLATE.md 必须部分)
// ============================================================
let dragCursorFollower = null;
let dragState = null;

function ensureCursorFollower() {
  if (!dragCursorFollower) {
    dragCursorFollower = document.createElement('div');
    dragCursorFollower.id = 'drag-cursor-follower';
    dragCursorFollower.style.backgroundImage = "url('images/cursor-grabbing.png')";
    document.body.appendChild(dragCursorFollower);
  }
}
function removeCursorFollower() { if (dragCursorFollower) { dragCursorFollower.remove(); dragCursorFollower = null; } }
function cleanupDrag() {
  if (dragState && dragState.clone) dragState.clone.remove();
  dragState = null;
  document.body.classList.remove('dragging');
  removeCursorFollower();
  document.querySelectorAll('.drag-over-target').forEach(el => el.classList.remove('drag-over-target'));
}

function startManualDrag(e) {
  if (e.button !== 0) return; e.preventDefault();
  const itemEl = e.currentTarget;
  const clone = document.createElement('div');
  clone.style.cssText = `
    position: fixed; pointer-events: none; z-index: 99998;
    width: ${itemEl.offsetWidth}px; height: ${itemEl.offsetHeight}px;
    background-image: ${itemEl.style.backgroundImage};
    background-size: contain; background-repeat: no-repeat; background-position: center;
    opacity: 0.85; display: none; transform: translate(-50%, -50%);
  `;
  document.body.appendChild(clone);
  dragState = { itemId: itemEl.getAttribute('data-item-id'), sourceEl: itemEl, startX: e.clientX, startY: e.clientY, started: false, clone };
}

document.addEventListener('mousemove', function(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  if (!dragState.started) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    dragState.started = true;
    document.body.classList.add('dragging');
    ensureCursorFollower();
    dragState.clone.style.display = 'block';
  }
  dragState.clone.style.left = e.clientX + 'px';
  dragState.clone.style.top = e.clientY + 'px';
  if (dragCursorFollower) { dragCursorFollower.style.left = e.clientX + 'px'; dragCursorFollower.style.top = e.clientY + 'px'; }
  const elUnder = document.elementFromPoint(e.clientX, e.clientY);
  const dropTarget = elUnder && elUnder.closest && elUnder.closest('[data-drop-target]');
  document.querySelectorAll('.drag-over-target').forEach(el => { if (el !== dropTarget) el.classList.remove('drag-over-target'); });
  if (dropTarget && !dropTarget.classList.contains('drag-over-target')) dropTarget.classList.add('drag-over-target');
});

document.addEventListener('mouseup', function(e) {
  if (!dragState) return;
  if (dragState.started) {
    const elUnder = document.elementFromPoint(e.clientX, e.clientY);
    const dropTarget = elUnder && elUnder.closest && elUnder.closest('[data-drop-target]');
    if (dropTarget) handleDrop(dragState.itemId, dropTarget.dataset.dropTarget, dropTarget);
  }
  cleanupDrag();
});

document.getElementById('game-container').addEventListener('mouseleave', () => { if (dragState) cleanupDrag(); });

function handleDrop(itemId, targetId, targetEl) {
  if (itemId !== 'remote') return;

  // 遥控器拖到塔上 → 激活塔的变色序列
  if (targetId && targetId.startsWith('tower-')) {
    const roomLetter = targetId.replace('tower-', '');
    if (rooms[state.currentRoomIndex] !== roomLetter) {
      showDialog('你不在那个房间，无法使用遥控器。');
      return;
    }
    activateTower(roomLetter);
    return;
  }

  // 遥控器拖到 NPC1 → 触发最终对话
  if (targetId === 'npc1') {
    const allSolved = state.puzzles.B.solved && state.puzzles.C.solved &&
                      state.puzzles.D.solved && state.puzzles.E.solved;
    if (!allSolved) {
      showDialog('对着我用遥控器干嘛？');
      return;
    }
    if (state.npc1FinalDialogDone) {
      showDialog('遥控器已经完成使命了。');
      return;
    }
    // 最终完成！
    state.npc1FinalDialogDone = true;
    removeItem('remote', 1);
    hideDialog();
    playSound('collect');
    // "太好了！我的节奏回来了！送你这个！"对话框点击消失后，再出现通关道具窗口
    showDialogPersistent('太好了！我的节奏回来了！送你这个！', () => {
      if (!state.hasGlasses) {
        state.hasGlasses = true;
        playSound('collect');
        showPickupModal('ai-glasses');
      }
    });
    return;
  }
}

let isDraggingInventory = false, invScrollStartY = 0, invScrollTop = 0;

// ============================================================
// 移动端触摸拖拽
// ============================================================
let touchDragItem = null, touchGhost = null;

document.addEventListener('touchstart', function(e) {
  const target = e.target;
  if (target.classList.contains('inv-item')) {
    touchStart(e);
  }
}, { passive: false });

function touchStart(e) {
  if (e.touches.length !== 1) return;
  const itemEl = e.currentTarget;
  touchDragItem = { itemId: itemEl.getAttribute('data-item-id'), sourceEl: itemEl, startX: e.touches[0].clientX, startY: e.touches[0].clientY, started: false };
  touchGhost = document.createElement('div');
  touchGhost.style.cssText = `
    position: fixed; pointer-events: none; z-index: 99998;
    width: ${itemEl.offsetWidth}px; height: ${itemEl.offsetHeight}px;
    background-image: ${itemEl.style.backgroundImage};
    background-size: contain; background-repeat: no-repeat; background-position: center;
    opacity: 0.85; display: none; transform: translate(-50%, -50%);
  `;
  document.body.appendChild(touchGhost);
  e.preventDefault();
}

document.addEventListener('touchmove', function(e) {
  if (!touchDragItem) return;
  const touch = e.touches[0];
  const dx = touch.clientX - touchDragItem.startX, dy = touch.clientY - touchDragItem.startY;
  if (!touchDragItem.started) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    touchDragItem.started = true;
    touchGhost.style.display = 'block';
  }
  touchGhost.style.left = touch.clientX + 'px';
  touchGhost.style.top = touch.clientY + 'px';
  const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
  const dropTarget = elUnder && elUnder.closest && elUnder.closest('[data-drop-target]');
  document.querySelectorAll('.drag-over-target').forEach(el => { if (el !== dropTarget) el.classList.remove('drag-over-target'); });
  if (dropTarget && !dropTarget.classList.contains('drag-over-target')) dropTarget.classList.add('drag-over-target');
}, { passive: false });

document.addEventListener('touchend', function(e) {
  if (!touchDragItem) return;
  if (touchDragItem.started) {
    const touch = e.changedTouches[0];
    const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
    const dropTarget = elUnder && elUnder.closest && elUnder.closest('[data-drop-target]');
    if (dropTarget) handleDrop(touchDragItem.itemId, dropTarget.dataset.dropTarget, dropTarget);
  }
  if (touchGhost) { touchGhost.remove(); touchGhost = null; }
  document.querySelectorAll('.drag-over-target').forEach(el => el.classList.remove('drag-over-target'));
  touchDragItem = null;
});

// ============================================================
// BGM 首交互启动
// ============================================================
let bgmStarted = false;
function tryStartBgm() {
  if (!bgmStarted && musicVolume > 0.01) {
    startBgm();
    bgmStarted = true;
  }
}

// ============================================================
// 初始化
// ============================================================
function initGame() {
  loadSettings();
  // 统一：对话框不自动消失，点击对话框范围区域后才关闭；显示期间锁定游戏界面
  document.getElementById('dialog-box').addEventListener('click', function () {
    const cb = dialogClickCallback;
    dialogClickCallback = null;
    hideDialog();
    if (cb) cb();
  });

  // 每次刷新完全重置 — 为所有房间生成全新颜色序列
  ['B','C','D','E'].forEach(letter => {
    state.puzzles[letter].colorSequence = generateColorSequence(ROOM_SEQUENCE_LENGTH[letter]);
  });

  updateNavVisibility();
  updateRoomVisuals();
  updateGreyBubbles();
  renderInventory();
  renderBackpack();

  // 首交互启动 BGM
  const startBgmOnInteract = () => {
    getAudioCtx(); // 解锁 AudioContext
    tryStartBgm();
    document.removeEventListener('click', startBgmOnInteract);
    document.removeEventListener('touchstart', startBgmOnInteract);
  };
  document.addEventListener('click', startBgmOnInteract);
  document.addEventListener('touchstart', startBgmOnInteract);

  console.log('🎮 活力缤纷大铁柱 — 铁塔五色');
  console.log('   Room B 序列:', state.puzzles.B.colorSequence.map(c => COLOR_NAME_CN[c]).join(' → '));
  console.log('   Room C 序列:', state.puzzles.C.colorSequence.map(c => COLOR_NAME_CN[c]).join(' → '));
  console.log('   Room D 序列:', state.puzzles.D.colorSequence.map(c => COLOR_NAME_CN[c]).join(' → '));
  console.log('   Room E 序列:', state.puzzles.E.colorSequence.map(c => COLOR_NAME_CN[c]).join(' → '));

  // 横屏提示
  document.getElementById('landscape-hint').addEventListener('click', function (e) { if (e.target === e.currentTarget) dismissLandscapeHint(); });
  document.getElementById('landscape-hint-close').addEventListener('click', dismissLandscapeHint);
}

window.addEventListener('DOMContentLoaded', initGame);
</script>
