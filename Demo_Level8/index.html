<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>铝人世界</title>
<style>
    /* 基础布局 */
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #111; font-family: sans-serif; user-select: none; overflow: hidden; position: relative; }

    /* ========== 自定义鼠标指针 ========== */
    /* 指针图片：images/cursor-*.png — 32×32 PNG，热点坐标见注释。 */

    /* 1. 游戏容器默认指针 — 箭头 */
    #game-container {
        cursor: url('images/cursor-default.png') 2 2, auto;
    }

    /* 2. 可点击交互元素 — 统一使用默认指针 */
    .clickable,
    .nav-btn,
    #settings-btn,
    #backpack-btn,
    #btn-back,
    #settings-link-btn,
    #backpack-close-btn,
    #settings-overlay {
        cursor: url('images/cursor-default.png') 2 2, auto;
    }

    /* 3. 接受拖放的区域 — 实体 NPC、拼装槽位 */
    .assemble-slot,
    .entity[ondragover] {
        cursor: url('images/cursor-default.png') 2 2, auto;
    }

    /* 4. 音量滑块轨道与滑块 */
    .volume-row input[type="range"],
    .volume-row input[type="range"]::-webkit-slider-thumb {
        cursor: url('images/cursor-default.png') 2 2, auto;
    }

    /* 5. 可拖拽物品 — 张开的手（grab 回退） */
    .inv-item {
        cursor: url('images/cursor-grab.png') 16 16, grab;
    }

    /* 统一：原生控件（<button>、滑块等）不继承自定义指针，这里显式指定 */
    button, input[type="range"] { cursor: url('images/cursor-default.png') 2 2, auto; }
    /* 6. 拖拽进行中 — 隐藏系统光标，由 JS 光标跟随器接管 */
    html.dragging,
    body.dragging,
    body.dragging * {
        cursor: none !important;
    }

    /* 7. 拖拽光标跟随器（JS 动态创建） */
    #drag-cursor-follower {
        position: fixed;
        pointer-events: none;
        z-index: 99999;
        width: 32px;
        height: 32px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        transform: translate(-16px, -16px); /* 热点在中心 */
    }

    /* 8. 拖拽悬停在有效放置目标上 — 高亮指示 */
    body.dragging .drag-over-target {
        filter: brightness(1.3) drop-shadow(0 0 6px cyan);
    }
    
    /* 游戏主容器 */
    #game-container { 
        width: 1280px; 
        height: 720px; 
        position: absolute; 
        left: 50%; 
        top: 50%; 
        transform: translate(-50%, -50%);
        background: #222; 
        overflow: hidden; 
        box-shadow: 0 0 20px rgba(0,0,0,0.8); 
        transform-origin: center center;
    }
    #room-area { width: 1120px; height: 720px; position: absolute; left: 0; top: 0; background: #444; }
    
    /* 物品栏 UI */
    #ui-inventory { 
        width: 160px; 
        height: 720px; 
        position: absolute; 
        right: 0; 
        top: 0; 
        background-image: url('images/ui-inventory-bg.png'); 
        background-size: cover; 
        border-left: 2px solid #000; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding-top: 15px; 
        padding-bottom: 15px;
        gap: 15px; 
        box-sizing: border-box; 
        overflow-y: auto; /* 允许垂直滚动 */
        scrollbar-width: none; /* Firefox 隐藏滚动条 */
        -ms-overflow-style: none;  /* IE and Edge 隐藏滚动条 */
    }
    #ui-inventory::-webkit-scrollbar {
        display: none; /* Chrome, Safari and Opera 隐藏滚动条 */
    }
    .inv-slot { width: 120px; height: 120px; background: rgba(0,0,0,0.3); border: 2px solid #333; position: relative; border-radius: 5px; flex-shrink: 0; /* 防止物品过多时被压缩 */ }
    .inv-item { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; color: rgba(255,255,255,0.8); text-align: center; background-size: contain; background-repeat: no-repeat; background-position: center; text-shadow: 1px 1px 3px #000; }
    .inv-count { position: absolute; bottom: 5px; right: 8px; color: #fff; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none; }
    
    /* 导航与对话框 */
    .nav-btn { position: absolute; top: 335px; width: 50px; height: 60px; z-index: 100; display: flex; justify-content: center; align-items: center; color: transparent; background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.7; }
    .nav-btn:hover { filter: brightness(1.2); }
    #nav-left { left: 15px; background-image: url('images/nav-left.png'); }
    #nav-right { right: 15px; background-image: url('images/nav-right.png'); }
    
    #dialog-box { position: absolute; bottom: 40px; left: 160px; width: 800px; min-height: 70px; background: rgba(255,255,255,0.95); border: 3px solid #333; border-radius: 15px; padding: 20px; box-sizing: border-box; font-size: 20px; color: #000; display: none; z-index: 10001; pointer-events: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center; }
    /* 对话框模态锁：对话框显示期间锁定整个游戏界面，仅对话框本身可点击 */
    #dialog-lock { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: none; }
    #dialog-lock.show { display: block; }
    
    /* 房间控制 */
    .room { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; background-size: cover; background-position: center; background-color: #333; }
    .active-room { display: block; }
    
    /* 游戏内元素通用样式 (保留文字但增加阴影，背景设为透明以显示图片) */
    .entity { position: absolute; display: flex; justify-content: center; align-items: center; text-align: center; font-weight: bold; color: rgba(255,255,255,0.7); text-shadow: 1px 1px 3px #000; background-size: contain; background-repeat: no-repeat; background-position: center; }
    .clickable:hover { filter: brightness(1.2); }
    
    /* 房间A 元素 */
    #room-A { background-image: url('images/room-A-bg.png'); }
    #doctor { width: 480px; height: 750px; left: 305px; top: 150px; background-image: url('images/doctor.png'); }
    #counter-a { width: 1120px; height: 320px; left: 0px; top: 450px; background-image: url('images/counter-a.png'); z-index: 5; }
    #head-desk { width: 200px; height: 200px; left: 250px; top: 340px; background-image: url('images/head.png'); z-index: 10; }
    #dog-a { width: 120px; height: 120px; left: 730px; top: 390px; background-image: url('images/dog-a.png'); display: none; z-index: 10; }
    #voice-unit { width: 60px; height: 60px; left: 660px; top: 450px; background-image: url('images/voice.png'); display: none; z-index: 10; }
    
    /* 房间B 元素 */
    #room-B { background-image: url('images/room-B-bg.png'); }
    #bassist { width: 300px; height: 300px; left: 150px; top: 250px; background-image: url('images/bassist.png'); }
    #drummer { width: 280px; height: 280px; left: 420px; top: 170px; background-image: url('images/drummer.png'); }
    #guitarist { width: 300px; height: 300px; left: 650px; top: 250px; background-image: url('images/guitarist.png'); }
    #singer-broken { width: 150px; height: 180px; left: 455px; top: 450px; background-image: url('images/singer-broken.png'); }
    #singer-full { width: 330px; height: 330px; left: 350px; top: 270px; background-image: url('images/singer-full.png'); display: none; z-index: 10; }
    
    /* 房间C 元素 */
    #room-C { background-image: url('images/room-C-bg.png'); }
    #shopkeeper { width: 315px; height: 495px; left: 400px; top: 216px; background-image: url('images/shopkeeper.png'); }
    #counter-c { width: 1120px; height: 320px; left: 0px; top: 400px; background-image: url('images/counter-c.png'); z-index: 5; }
    .drone-red { width: 75px; height: 75px; z-index: 10; }
    #drone-r1 { left: 366px; top: 301px; background-image: url('images/drone-r1.png'); }
    #drone-r2 { left: 820px; top: 303px; background-image: url('images/drone-r2.png'); }
    #drone-r3 { left: 300px; top: 480px; background-image: url('images/drone-r3.png'); }
    #leg-l { width: 120px; height: 300px; left: 500px; top: 380px; background-image: url('images/leg-l.png'); display: none; z-index: 10; }
    
    /* 房间D 元素 */
    #room-D { background-image: url('images/room-D-bg.png'); }
    .dog-d { width: 120px; height: 120px; top: 366px; background-image: url('images/dog-d.png'); }
    #dog-d1 { left: 140px; } #dog-d2 { left: 320px; } #dog-d3 { left: 500px; } #dog-d4 { left: 680px; } #dog-d5 { left: 860px; }
    .coin-drop { width: 45px; height: 45px; top: 466px; display: none; background-image: url('images/coin.png'); }
    #coin-1 { left: 135px; } #coin-2 { left: 315px; } #coin-3 { left: 495px; } #coin-5 { left: 855px; }
    #body-drop { width: 120px; height: 150px; left: 680px; top: 336px; background-image: url('images/body.png'); display: none; }
    
    /* 拼装房间 */
    #room-Assemble { background-image: url('images/room-Assemble-bg.png'); }
    .assemble-slot { width: 120px; height: 120px; border: 1px dashed #aaa; position: absolute; display: flex; justify-content: center; align-items: center; color: #aaa; font-size: 16px; background-size: contain; background-repeat: no-repeat; background-position: center; }
    #slot-head { left: 500px; top: 100px; }
    #slot-body { left: 500px; top: 220px; height: 180px; }
    #slot-arm-l { left: 380px; top: 220px; }
    #slot-arm-r { left: 620px; top: 220px; }
    #slot-leg-l { left: 440px; top: 400px; height: 150px; }
    /* 已存在的部件 */
    .part-exist { border: none; color: transparent; }
    #part-leg-r { left: 560px; top: 400px; height: 150px; background-image: url('images/part-leg-r.png'); }
    #part-foot-l { left: 440px; top: 550px; height: 150px; background-image: url('images/part-foot-l.png'); }
    #part-foot-r { left: 560px; top: 550px; height: 150px; background-image: url('images/part-foot-r.png'); }
    #btn-back { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #fff; font-weight: bold; font-size: 18px; border-radius: 5px; z-index: 100; }

    /* ========== 设置按钮与面板 ========== */
    #settings-btn {
        position: absolute;
        top: 12px;
        right: 172px; /* 避开物品栏 (160px + 12px margin) */
        width: 42px;
        height: 42px;
        z-index: 300;
        border-radius: 50%;
        background: rgba(0,0,0,0.55);
        border: 2px solid rgba(255,255,255,0.35);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.25s ease;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    #settings-btn:hover {
        background: rgba(0,0,0,0.75);
        border-color: rgba(255,255,255,0.6);
        transform: rotate(30deg);
    }
    #settings-btn svg {
        width: 24px;
        height: 24px;
        fill: rgba(255,255,255,0.85);
        pointer-events: none;
    }

    /* 设置覆盖层 — 以当前游戏画面为背景（半透明模糊） */
    #settings-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 400;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
    }
    #settings-overlay.active {
        display: flex;
    }

    /* 设置面板卡片 */
    #settings-panel {
        position: relative;
        width: 400px;
        background: rgba(20,20,30,0.92);
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 16px;
        padding: 32px 36px 28px;
        box-sizing: border-box;
        color: #e0e0e0;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        pointer-events: auto;
    }
    #settings-panel h3 {
        margin: 0 0 24px;
        font-size: 22px;
        text-align: center;
        color: #fff;
        letter-spacing: 2px;
        font-weight: 500;
    }

    /* 音量控制行 */
    .volume-row {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        gap: 12px;
    }
    .volume-row .vol-label {
        width: 56px;
        font-size: 15px;
        color: #bbb;
        flex-shrink: 0;
        text-align: right;
    }
    .volume-row .vol-icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        opacity: 0.7;
    }
    /* 自定义滑块 */
    .volume-row input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 6px;
        background: rgba(255,255,255,0.18);
        border-radius: 3px;
        outline: none;
    }
    .volume-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #888;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        transition: transform 0.15s ease;
    }
    .volume-row input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }
    .volume-row .vol-value {
        width: 36px;
        text-align: center;
        font-size: 14px;
        color: #aaa;
        flex-shrink: 0;
    }

    /* 外链按钮 */
    #settings-link-btn {
        display: block;
        width: 100%;
        margin-top: 24px;
        padding: 12px 0;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 10px;
        color: #ddd;
        font-size: 16px;
        text-align: center;
        letter-spacing: 1px;
        transition: all 0.2s ease;
        font-family: inherit;
    }
    #settings-link-btn:hover {
        background: rgba(255,255,255,0.2);
        border-color: rgba(255,255,255,0.45);
        color: #fff;
    }

    /* ========== BACKPACK BUTTON ========== */
    #backpack-btn {
      position: absolute;
      top: 12px; right: 222px;
      width: 42px; height: 42px;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #backpack-btn:hover {
      background: rgba(0, 0, 0, 0.75);
      border-color: rgba(255, 255, 255, 0.6);
    }
    #backpack-btn svg {
      width: 24px; height: 24px;
      fill: rgba(255, 255, 255, 0.85);
    }

    /* ========== BACKPACK OVERLAY ========== */
    #backpack-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 400;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #backpack-overlay.show { display: flex; }

    /* ========== BACKPACK PANEL ========== */
    #backpack-panel {
      position: relative;
      width: 340px;
      background: rgba(20, 20, 30, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 32px 28px 28px;
      color: #e0e0e0;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      pointer-events: auto;
      box-sizing: border-box;
    }
    #backpack-panel h3 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #fff;
    }

    /* ========== BACKPACK CLOSE BUTTON ========== */
    #backpack-close-btn {
      position: absolute;
      top: 10px; right: 16px;
      width: 32px; height: 32px;
      background: none;
      border: none;
      color: #999;
      font-size: 24px;
      transition: color 0.2s;
      line-height: 32px;
      text-align: center;
      padding: 0;
    }
    #backpack-close-btn:hover { color: #fff; }

    /* ========== BACKPACK 3x3 GRID ========== */
    #backpack-grid {
      display: grid;
      grid-template-columns: repeat(3, 84px);
      grid-template-rows: repeat(3, 84px);
      gap: 10px;
      justify-content: center;
    }

    /* ========== BACKPACK SLOT ========== */
    .bp-slot {
      width: 84px; height: 84px;
      background: rgba(0, 0, 0, 0.35);
      border: 2px dashed #444;
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== BACKPACK ITEM ========== */
    .bp-item {
      width: 100%; height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* ========== 道具拾取弹窗 ========== */
    #pickup-overlay {
      position: absolute; top: 0; left: 0;
      width: 1120px; height: 720px;
      background: rgba(0,0,0,0.7); z-index: 350; display: none;
      align-items: center; justify-content: center;
    }
    #pickup-overlay.visible { display: flex; }
    #pickup-panel {
      background: #1a1a2e; border: 2px solid #555; border-radius: 16px;
      padding: 30px 40px; width: 300px; color: #fff;
      text-align: center;
    }
    #pickup-panel h3 { margin-bottom: 20px; font-size: 20px; letter-spacing: 2px; }
    #pickup-item-img {
      width: 100px; height: 100px;
      background-size: contain; background-repeat: no-repeat; background-position: center;
      margin: 0 auto 12px;
    }
    #pickup-item-name { font-size: 16px; color: #ccc; margin-bottom: 24px; }
    #pickup-confirm-btn {
      padding: 10px 40px;
      background: #8B4513; border: none; border-radius: 8px;
      color: #fff; font-size: 15px; cursor: url('images/cursor-default.png') 2 2, auto; letter-spacing: 2px;
    }
    #pickup-confirm-btn:hover { background: #A0522D; }

    /* === 横屏提示遮罩 === */
    #landscape-hint {
      position: fixed; inset: 0;
      background: #0a0a0a;
      z-index: 100000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      text-align: center;
      user-select: none; -webkit-user-select: none;
    }
    #landscape-hint.show { display: flex; }
    #landscape-hint-icon {
      width: 76px; height: 76px;
      animation: hintLockPulse 1.8s ease-in-out infinite;
    }
    @keyframes hintLockPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    #landscape-hint p { font-size: 18px; letter-spacing: 2px; opacity: 0.85; }
    #landscape-hint .hint-sub { font-size: 13px; opacity: 0.5; letter-spacing: 1px; }
    #landscape-hint-close {
      margin-top: 8px;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      color: #ddd;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: url('images/cursor-default.png') 2 2, auto;
      transition: background 0.2s, color 0.2s;
    }
    #landscape-hint-close:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
#return-btn {
  position: absolute;
  top: 12px; left: 12px;
  width: 42px; height: 42px;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-radius: 50%;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#return-btn:hover { background: rgba(0, 0, 0, 0.75); border-color: rgba(255, 255, 255, 0.6); }
#return-btn svg { width: 24px; height: 24px; fill: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>

<!-- 音频资源预加载 -->
<audio id="bgm" src="audio/bgm.mp3" loop></audio>
<audio id="bgm2" src="audio/bgm2.mp3" loop></audio>
<audio id="sfx-drum" src="audio/drum.mp3"></audio>
<audio id="sfx-guitar" src="audio/guitar.mp3"></audio>
<audio id="sfx-bass" src="audio/bass.mp3"></audio>
<audio id="sfx-dog" src="audio/dog.mp3"></audio>
<audio id="sfx-coin" src="audio/coin.mp3"></audio>
<audio id="sfx-sing" src="audio/sing.mp3"></audio>
<audio id="sfx-success" src="audio/success.mp3"></audio>

<div id="game-container">
    <div id="room-area">
        <!-- 房间A：义体医生 -->
        <div id="room-A" class="room active-room">
            <div id="doctor" class="entity clickable" onclick="interact('doctor')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'doctor')"></div>
            <div id="counter-a" class="entity"></div>
            <div id="head-desk" class="entity clickable" onclick="collect('head')"></div>
            <div id="dog-a" class="entity" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'dog-a')"></div>

<script>
// ============================================================
// ① 设备识别（必须放在 <script> 最顶部，先于 resizeGame()）
// 生成 window.deviceInfo，并给 <html> 打上 device-* 类
// ============================================================
(function detectDevice() {
  const ua = navigator.userAgent;

  // 系统
  const isIOS     = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isMac     = /Mac/i.test(ua) && !isIOS;
  const isWindows = /Windows/i.test(ua);

  // 设备形态
  const isTablet   = /iPad/i.test(ua) || (isAndroid && !/Mobile/i.test(ua));
  const isMobileUA = /Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  const isTouch    = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const coarsePtr  = window.matchMedia ? window.matchMedia('(pointer: coarse)').matches : false;
  const noHover    = window.matchMedia ? window.matchMedia('(hover: none)').matches : false;
  // 只有「主指针是粗指针且无悬停能力」才算触屏为主（手机/平板），
  // 避免把带触屏的桌面笔记本误判成移动端。
  const isTouchPrimary = coarsePtr && noHover;
  const isMobile   = isMobileUA || isTouchPrimary;

  // 浏览器
  const isWeChat  = /MicroMessenger/i.test(ua);
  const isQQ      = /QQ\//i.test(ua);
  const isSafari  = /Safari/i.test(ua) && !/Chrome|CriOS|Edg|OPR/i.test(ua);
  const isChrome  = /Chrome|CriOS/i.test(ua) && !/Edg|OPR/i.test(ua);
  const isEdge    = /Edg/i.test(ua);
  const isFirefox = /Firefox/i.test(ua);

  const isPortrait = window.matchMedia
    ? window.matchMedia('(orientation: portrait)').matches
    : window.innerHeight > window.innerWidth;

  window.deviceInfo = {
    isMobile, isTablet, isMobileDevice: isMobile || isTablet, isDesktop: !isMobile && !isTablet,
    isTouch, isIOS, isAndroid, isMac, isWindows,
    isWeChat, isQQ, isSafari, isChrome, isEdge, isFirefox,
    isPortrait, isLandscape: !isPortrait,
    os: isIOS ? 'ios' : isAndroid ? 'android' : isWindows ? 'windows' : isMac ? 'mac' : 'other',
    browser: isWeChat ? 'wechat' : isQQ ? 'qq' : isSafari ? 'safari'
           : isEdge ? 'edge' : isFirefox ? 'firefox' : isChrome ? 'chrome' : 'other',
    type: isMobile ? 'mobile' : isTablet ? 'tablet' : 'desktop'
  };

  const root = document.documentElement;
  root.classList.add('device-' + deviceInfo.type);
  root.setAttribute('data-device', deviceInfo.type);
  if (deviceInfo.isTouch)     root.classList.add('device-touch');
  if (deviceInfo.isIOS)       root.classList.add('device-ios');
  if (deviceInfo.isAndroid)   root.classList.add('device-android');
  if (deviceInfo.isWeChat)    root.classList.add('device-wechat');
  if (deviceInfo.isPortrait)  root.classList.add('device-portrait');
  else                        root.classList.add('device-landscape');

  console.log('📱 设备识别:', deviceInfo);
})();

console.log('🎮 铝人世界 — Robot Band Rescue');

// ============================================================
// ② 画布缩放 + 移动端强制横屏（必须放在设备识别之后）
// ============================================================
function resizeGame() {
  const gc = document.getElementById('game-container');
  // 移动端竖屏时旋转 90° 强制横屏（微信等不跟随设备方向的 webview 也能横屏）
  const rotated = deviceInfo.isMobileDevice && deviceInfo.isPortrait;
  let s;
  if (rotated) {
    // 旋转后宽高互换：游戏宽 1280 → 视口高，游戏高 720 → 视口宽
    s = Math.min(window.innerHeight / 1280, window.innerWidth / 720);
    gc.style.transform = `translate(-50%, -50%) rotate(90deg) scale(${s})`;
  } else {
    s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    gc.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  gc.classList.toggle('rotated', rotated);
}
window.addEventListener('resize', resizeGame);
resizeGame();

// ============================================================
// ③ 方向监听 + 横屏锁屏提示（一次性、可关闭、6 秒自动消失）
// ============================================================
let landscapeHintDismissed = false;
let landscapeHintTimer = null;

// 以「实际 viewport 是否横屏」为准，而非按 app 类型判断：
// 微信/QQ 等不响应旋屏的内置浏览器会一直停在竖屏，isLandscape 恒为 false，自然不触发提示。
function updateLandscapeHint() {
  const hint = document.getElementById('landscape-hint');
  if (!hint) return;
  const shouldShow = deviceInfo.isMobileDevice && deviceInfo.isLandscape && !landscapeHintDismissed;
  if (shouldShow && !hint.classList.contains('show')) {
    hint.classList.add('show');
    if (landscapeHintTimer) clearTimeout(landscapeHintTimer);
    landscapeHintTimer = setTimeout(dismissLandscapeHint, 6000);
  } else if (!shouldShow) {
    hint.classList.remove('show');
  }
}

function dismissLandscapeHint() {
  landscapeHintDismissed = true;
  if (landscapeHintTimer) { clearTimeout(landscapeHintTimer); landscapeHintTimer = null; }
  const hint = document.getElementById('landscape-hint');
  if (hint) hint.classList.remove('show');
}

function updateOrientation() {
  const isPortrait = window.matchMedia
    ? window.matchMedia('(orientation: portrait)').matches
    : (window.innerHeight > window.innerWidth);

  deviceInfo.isPortrait = isPortrait;
  deviceInfo.isLandscape = !isPortrait;
  const root = document.documentElement;
  root.classList.toggle('device-portrait', isPortrait);
  root.classList.toggle('device-landscape', !isPortrait);

  resizeGame(); // 方向变化后重算缩放/旋转
  updateLandscapeHint();
}
window.addEventListener('resize', updateOrientation);
window.addEventListener('orientationchange', updateOrientation);
if (window.screen && screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', updateOrientation);
}
updateOrientation();

function playSynthSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    const v = sfxVolume; // 全局音效音量

    if (type === 'drum') {
        osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
        gain.gain.setValueAtTime(1 * v, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'guitar') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(330, now);
        gain.gain.setValueAtTime(0.5 * v, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
        osc.start(now); osc.stop(now + 1);
    } else if (type === 'bass') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(82, now);
        gain.gain.setValueAtTime(0.8 * v, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
        osc.start(now); osc.stop(now + 1);
    } else if (type === 'dog') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(600, now + 0.1); osc.frequency.linearRampToValueAtTime(300, now + 0.2);
        gain.gain.setValueAtTime(0.5 * v, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'coin') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); osc.frequency.setValueAtTime(1600, now + 0.1);
        gain.gain.setValueAtTime(0.5 * v, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'sing') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.linearRampToValueAtTime(554, now + 0.3); osc.frequency.linearRampToValueAtTime(659, now + 0.6);
        gain.gain.setValueAtTime(0.5 * v, now); gain.gain.linearRampToValueAtTime(0, now + 1);
        osc.start(now); osc.stop(now + 1);
    } else if (type === 'success') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.5 * v, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    }
}

function playSound(type) {
    const audioEl = document.getElementById('sfx-' + type);
    if (audioEl) {
        audioEl.currentTime = 0;
        let playPromise = audioEl.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => { playSynthSound(type); });
        }
    } else {
        playSynthSound(type);
    }
}

let dialogTimeout;
// 持久对话框：点击对话框消失后再执行回调（如"终于修好了"之后弹通关道具窗口）
let dialogClickCallback = null;
function showDialogPersistent(text, callback) {
    const box = document.getElementById('dialog-box');
    box.innerText = text;
    box.style.display = 'block';
    clearTimeout(dialogTimeout);
    document.getElementById('dialog-lock').classList.add('show');
    dialogClickCallback = callback || null;
}
function showDialog(text) {
    const box = document.getElementById('dialog-box');
    box.innerText = text;
    box.style.display = 'block';
    clearTimeout(dialogTimeout);
    // 统一：对话框不自动消失，点击对话框范围区域后才关闭；显示期间锁定游戏界面
    document.getElementById('dialog-lock').classList.add('show');
}

// --- 物品栏逻辑 ---
function addItem(id) {
    let item = state.inventory.find(i => i.id === id);
    if (item) item.count++;
    else state.inventory.push({ id: id, count: 1 });
    renderInventory();
}

function removeItem(id, count = 1) {
    let index = state.inventory.findIndex(i => i.id === id);
    if (index > -1) {
        state.inventory[index].count -= count;
        if (state.inventory[index].count <= 0) state.inventory.splice(index, 1);
        renderInventory();
        return true;
    }
    return false;
}

function getCount(id) {
    let item = state.inventory.find(i => i.id === id);
    return item ? item.count : 0;
}

function renderInventory() {
    const invDiv = document.getElementById('ui-inventory');
    invDiv.innerHTML = '';
    state.inventory.forEach(item => {
        let slot = document.createElement('div');
        slot.className = 'inv-slot';
        
        let itemDiv = document.createElement('div');
        itemDiv.className = 'inv-item';
        itemDiv.dataset.id = item.id;
        itemDiv.style.backgroundImage = `url('images/item-${item.id}.png')`;
        itemDiv.onmousedown = startManualDrag;
        // 移动端触摸拖拽（与上面的鼠标链路并存，互不干扰）
        itemDiv.addEventListener('touchstart', touchStart, { passive: false });
        itemDiv.addEventListener('touchmove', touchMove, { passive: false });
        itemDiv.addEventListener('touchend', touchEnd);
        itemDiv.addEventListener('touchcancel', touchCancel);
        
        slot.appendChild(itemDiv);
        
        if (item.count > 1) {
            let countDiv = document.createElement('div');
            countDiv.className = 'inv-count';
            countDiv.innerText = 'x' + item.count;
            slot.appendChild(countDiv);
        }
        invDiv.appendChild(slot);
    });
}

// --- 背包系统 ---
// ---- 返回 Level0（获得通关道具后，左上角出现返回按钮） ----
const RETURN_LEVEL_NUM = 8;
const RETURN_ITEM_ID = 'dog';

function updateReturnBtn() {
  const btn = document.getElementById('return-btn');
  if (!btn) return;
  let has = false;
  try { const s = JSON.parse(localStorage.getItem('linkgame_backpack') || '[]'); has = s.indexOf(RETURN_ITEM_ID) !== -1; } catch (e) {}
  btn.style.display = has ? 'flex' : 'none';
}

function returnToLevel0() {
  try { localStorage.setItem('linkgame_pendingReturn', String(RETURN_LEVEL_NUM)); } catch (e) {}
  window.location.href = '../Demo_Level0/index.html';
}

window.addEventListener('DOMContentLoaded', updateReturnBtn);

function addBackpackItem(id) {
    if (state.backpack.length >= 9) return;
    state.backpack.push(id);
    // 跨关卡同步：把本关道具合并进共享背包键（Demo_Level0 通关检测用）
    try {
        const shared = JSON.parse(localStorage.getItem('linkgame_backpack') || '[]');
        state.backpack.forEach(pid => { if (shared.indexOf(pid) === -1) shared.push(pid); });
        localStorage.setItem('linkgame_backpack', JSON.stringify(shared));
    } catch (e) {}
    updateReturnBtn();
    renderBackpack();
    // 获得本关通关物品 → 对话框提示返回地铁站
    if (id === RETURN_ITEM_ID) showDialog('点击左上角返回地铁站吧！');
}

function renderBackpack() {
    const grid = document.getElementById('backpack-grid');
    const slots = grid.querySelectorAll('.bp-slot');
    slots.forEach(s => { s.innerHTML = ''; s.classList.remove('filled'); });
    state.backpack.forEach((id, i) => {
        if (i >= slots.length) return;
        const item = document.createElement('div');
        item.className = 'bp-item';
        item.style.backgroundImage = `url('images/item-${id}.png')`;
        slots[i].appendChild(item);
        slots[i].classList.add('filled');
    });
}

function toggleBackpack() {
    document.getElementById('backpack-overlay').classList.toggle('show');
    if (document.getElementById('backpack-overlay').classList.contains('show')) {
        document.getElementById('settings-overlay').classList.remove('active');
    }
}

// --- 道具拾取弹窗 ---
function showPickupModal(itemId, itemName) {
    pendingPickupItem = itemId;
    document.getElementById('pickup-item-img').style.backgroundImage = `url('images/item-${itemId}.png')`;
    document.getElementById('pickup-item-name').textContent = itemName;

function confirmPickup() {

    }
}

// --- 手动拖拽系统（完全控制光标，无 OS 光标干扰） ---
let dragCursorFollower = null;
let dragState = null;

function ensureCursorFollower() {
    if (!dragCursorFollower) {
        dragCursorFollower = document.createElement('div');
        dragCursorFollower.id = 'drag-cursor-follower';
        dragCursorFollower.style.backgroundImage = "url('images/cursor-grabbing.png')";
        document.body.appendChild(dragCursorFollower);
    }
}

function updateFollowerCursor(overDropTarget) {
    if (!dragCursorFollower) return;
    dragCursorFollower.style.backgroundImage = "url('images/cursor-grabbing.png')";
}

function removeCursorFollower() {
    if (dragCursorFollower) {
        dragCursorFollower.remove();
        dragCursorFollower = null;
    }
}

function cleanupDrag() {
    if (dragState && dragState.clone) {
        dragState.clone.remove();
    }
    dragState = null;
    document.body.classList.remove('dragging');
    removeCursorFollower();
    document.querySelectorAll('.drag-over-target').forEach(el => el.classList.remove('drag-over-target'));
}

// 物品栏 mousedown — 开始手动拖拽
function startManualDrag(e) {
    if (e.button !== 0) return; // 仅左键
    e.preventDefault();

    const itemEl = e.currentTarget;
    const itemId = itemEl.dataset.id;

    // 创建物品跟随克隆体
    const clone = document.createElement('div');
    clone.style.cssText = `
        position: fixed; pointer-events: none; z-index: 99998;
        width: ${itemEl.offsetWidth}px; height: ${itemEl.offsetHeight}px;
        background-image: ${itemEl.style.backgroundImage};
        background-size: contain; background-repeat: no-repeat; background-position: center;
        opacity: 0.85; display: none;
        transform: translate(-50%, -50%);
    `;
    document.body.appendChild(clone);

    dragState = {
        itemId: itemId,
        sourceEl: itemEl,
        startX: e.clientX,
        startY: e.clientY,
        started: false,
        clone: clone
    };
}

// 全局 mousemove — 追踪拖拽
document.addEventListener('mousemove', function(e) {
    if (!dragState) return;

    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;

    // 移动阈值，区分点击和拖拽
    if (!dragState.started) {
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        // 超过阈值，正式开始拖拽
        dragState.started = true;
        document.body.classList.add('dragging');
        ensureCursorFollower();
        dragState.clone.style.display = 'block';
    }

    // 更新物品克隆位置
    dragState.clone.style.left = e.clientX + 'px';
    dragState.clone.style.top = e.clientY + 'px';

    // 更新光标跟随器位置
    if (dragCursorFollower) {
        dragCursorFollower.style.left = e.clientX + 'px';
        dragCursorFollower.style.top = e.clientY + 'px';
    }

    // 检测鼠标下方是否有放置目标
    const elUnder = document.elementFromPoint(e.clientX, e.clientY);
    const dropTarget = elUnder && elUnder.closest && elUnder.closest('[ondrop]');

    // 更新放置目标高亮
    document.querySelectorAll('.drag-over-target').forEach(el => {
        if (el !== dropTarget) el.classList.remove('drag-over-target');
    });
    if (dropTarget && !dropTarget.classList.contains('drag-over-target')) {
        dropTarget.classList.add('drag-over-target');
    }

    updateFollowerCursor(!!dropTarget);
});

// 全局 mouseup — 结束拖拽
document.addEventListener('mouseup', function(e) {
    if (!dragState) return;

    if (dragState.started) {
        // 检测放置目标
        const elUnder = document.elementFromPoint(e.clientX, e.clientY);
        const dropTarget = elUnder && elUnder.closest && elUnder.closest('[ondrop]');

        if (dropTarget) {
            const ondropAttr = dropTarget.getAttribute('ondrop');
            const match = ondropAttr && ondropAttr.match(/drop\(event,\s*'([^']+)'\)/);
            if (match) {
                handleDrop(dragState.itemId, match[1], dropTarget);
            }
        }
    }

    cleanupDrag();
});

// 鼠标离开游戏容器时取消拖拽
document.getElementById('game-container').addEventListener('mouseleave', function() {
    if (dragState) cleanupDrag();
});

// --- 移动端触摸拖拽 ---
// 与鼠标链路并行；放置目标的解析规则完全一致（同为 [ondrop] 属性），
// 最终都汇聚到 handleDrop()，因此两边行为不会有差异。
let touchDragItem = null;
let touchGhost = null;

// 取视口坐标下方最近的放置目标
function dropTargetAtPoint(x, y) {
    const elUnder = document.elementFromPoint(x, y);
    return (elUnder && elUnder.closest) ? elUnder.closest('[ondrop]') : null;
}

// 收尾：清高亮、移除跟随体、复位拖拽状态
function endTouchDrag() {
    document.querySelectorAll('.drag-over-target').forEach(el => el.classList.remove('drag-over-target'));
    document.body.classList.remove('dragging');
    if (touchGhost && touchGhost.parentNode) touchGhost.parentNode.removeChild(touchGhost);
    touchGhost = null;
    touchDragItem = null;
}

function touchStart(ev) {
    const itemEl = ev.target.closest && ev.target.closest('.inv-item');
    if (!itemEl) return;
    ev.preventDefault(); // 掐掉页面滚动，以及随后浏览器补发的合成 mousedown/click

    touchDragItem = itemEl.dataset.id;
    const touch = ev.touches[0];

    // 跟随手指的物品副本（样式与鼠标版 clone 保持一致）
    touchGhost = document.createElement('div');
    touchGhost.style.cssText = `
        position: fixed; pointer-events: none; z-index: 99998;
        width: ${itemEl.offsetWidth}px; height: ${itemEl.offsetHeight}px;
        background-image: ${itemEl.style.backgroundImage};
        background-size: contain; background-repeat: no-repeat; background-position: center;
        opacity: 0.85;
        transform: translate(-50%, -50%);
    `;
    touchGhost.style.left = touch.clientX + 'px';
    touchGhost.style.top = touch.clientY + 'px';
    document.body.appendChild(touchGhost);
    document.body.classList.add('dragging'); // 高亮规则挂在 body.dragging 上
}

function touchMove(ev) {
    if (!touchGhost) return;
    ev.preventDefault();
    const touch = ev.touches[0];
    touchGhost.style.left = touch.clientX + 'px';
    touchGhost.style.top = touch.clientY + 'px';

    const dropTarget = dropTargetAtPoint(touch.clientX, touch.clientY);
    document.querySelectorAll('.drag-over-target').forEach(el => {
        if (el !== dropTarget) el.classList.remove('drag-over-target');
    });
    if (dropTarget && !dropTarget.classList.contains('drag-over-target')) {
        dropTarget.classList.add('drag-over-target');
    }
}

function touchEnd(ev) {
    // 先取值再收尾（endTouchDrag 会把状态清空）
    const itemId = touchDragItem;
    const touch = ev.changedTouches[0];
    const dropTarget = itemId ? dropTargetAtPoint(touch.clientX, touch.clientY) : null;
    endTouchDrag();

    if (!itemId || !dropTarget) return;
    const ondropAttr = dropTarget.getAttribute('ondrop');
    const match = ondropAttr && ondropAttr.match(/drop\(event,\s*'([^']+)'\)/);
    if (match) handleDrop(itemId, match[1], dropTarget);
}

function touchCancel() {
    endTouchDrag();
}

// --- 核心交互逻辑 ---
function collect(itemId, index = null) {
    addItem(itemId);
    playSound('success');
    if (itemId === 'head') document.getElementById('head-desk').style.display = 'none';
    if (itemId === 'voice') {
        document.getElementById('voice-unit').style.display = 'none';
        state.voiceCollected = true;
        // 收集到发声单元后，提示拿去给主唱机器人
        showDialog("快把发声单元拿去给主唱机器人吧！");
    }
    if (itemId === 'leg-l') document.getElementById('leg-l').style.display = 'none';
    if (itemId === 'body') {
        document.getElementById('body-drop').style.display = 'none';
        state.bodyCollected = true;
    }
    if (itemId === 'coin' && index) document.getElementById('coin-' + index).style.display = 'none';
}

function interact(target) {
    if (target === 'doctor') {
        if (state.step === 0) showDialog("我的主唱散架了，你得负责把它修好！");
        else if (state.step === 1 && !state.doctorPaid) showDialog("就是你的机器狗弄得一团乱，你得赔我钱。");
        else if (state.step === 1 && state.doctorPaid && !state.voiceCollected) showDialog("好了，快让你的狗把发声单元吐出来。修好之后再来找我吧。");
        else if (state.step === 2) {
            // "终于修好了，机器狗我就还给你吧。"对话框点击消失后，再出现通关道具窗口
            showDialogPersistent("终于修好了，机器狗我就还给你吧。", () => {
                document.getElementById('dog-a').style.display = 'none';
                state.step = 3;
                playSound('collect');
                showPickupModal('dog', '机器狗');
            });
        }
    }
    else if (target === 'drummer') {
        playSound('drum');
        if (!state.armLCollected) {
            state.armLCollected = true;
            addItem('arm-l');
            showDialog("它的型号比我的先进……");
        } else showDialog("说好的组一辈子乐队呢？");
    }
    else if (target === 'guitarist') {
        playSound('guitar');
        if (!state.armRCollected) {
            state.armRCollected = true;
            addItem('arm-r');
            showDialog("主唱说我是它的左膀右臂。");
        } else showDialog("说好的组一辈子乐队呢？");
    }
    else if (target === 'bassist') {
        playSound('bass');
        if (!state.chocCollected) {
            state.chocCollected = true;
            addItem('choc');
        }
        if (!state.bodyCollected) {
            showDialog("人类的狗狗喜欢吃这个，那机器的狗狗会不会也喜欢吃？");
        } else {
            showDialog("说好的组一辈子乐队呢？");
        }
    }
    else if (target === 'shopkeeper') {
        showDialog("红色的是今天刚到的新货，您可以看看。");
    }
    else if (target === 'singer-full') {
        if (state.step === 1) {
            // 收集到发声单元后，主唱提示还给他
            if (state.voiceCollected) showDialog("你拿到我的发声单元了！快还给我吧！");
            else showDialog("没有发声单元我可不能唱歌……你去问问医生吧。");
        }
    }
}

function clickDrone(index) {
    if (state.dronesClicked[index-1]) return;
    state.dronesClicked[index-1] = true;
    document.getElementById('drone-r' + index).style.display = 'none';
    playSound('success');
    
    if (state.dronesClicked.every(v => v) && !state.legLCollected) {
        state.legLCollected = true;
        document.getElementById('leg-l').style.display = 'flex';
        showDialog("真识货，果然是行家，这个也是刚到的新货，您要不要看看？");
    }
}

function clickDog(index) {
    if (index === 4) {
        playSound('sing');
    } else {
        playSound('dog');
    }
}

function handleDrop(itemId, targetId, targetElement) {
    if (itemId === 'choc') {
        if (['doctor', 'drummer', 'guitarist', 'shopkeeper', 'singer-full'].includes(targetId)) {
            showDialog("yue！");
            return;
        } else if (targetId === 'bassist') {
            showDialog("人类的狗狗喜欢吃这个，那机器的狗狗会不会也喜欢？");
            return;
        }
    }

    if (targetId === 'doctor' && itemId === 'coin' && state.step === 1 && !state.doctorPaid) {
        if (getCount('coin') >= 4) {
            removeItem('coin', 4);
            state.doctorPaid = true;
            playSound('coin');
            showDialog("好了，快让你的狗把发声单元吐出来。");
        } else {
            showDialog("这点钱可不够，至少得4枚！");
        }
    }
    else if (targetId === 'dog-a' && itemId === 'choc' && state.step === 1 && state.doctorPaid && !state.voiceDropped) {
        state.voiceDropped = true;
        removeItem('choc');
        document.getElementById('voice-unit').style.display = 'flex';
        playSound('dog');
    }
    else if (targetId.startsWith('dog-d') && itemId === 'choc') {
        let dogIndex = parseInt(targetId.replace('dog-d', ''));
        if (!state.dogsFed[dogIndex-1]) {
            state.dogsFed[dogIndex-1] = true;
            if (dogIndex === 4) {
                document.getElementById('dog-d4').style.display = 'none';
                document.getElementById('body-drop').style.display = 'flex';
                playSound('sing');
            } else {
                document.getElementById('coin-' + dogIndex).style.display = 'flex';
                playSound('dog');
            }
        }
    }
    else if (targetId === 'singer-full' && itemId === 'voice' && state.step === 1) {
        removeItem('voice');
        state.step = 2;
        playSound('sing');
        showDialog("我已组装完毕！快帮我告诉医生吧！");
        // 切换到新背景音乐
        const bgm = document.getElementById('bgm');
        const bgm2 = document.getElementById('bgm2');
        if (bgm) { bgm.pause(); bgm.currentTime = 0; }
        if (bgm2) { bgm2.volume = musicVolume; let p = bgm2.play(); if (p) p.catch(e => {}); }
    }
    else if (targetId.startsWith('slot-')) {
        let requiredPart = targetId.replace('slot-', '');
        if (itemId === requiredPart) {
            removeItem(itemId);
            targetElement.style.backgroundImage = `url('images/item-${itemId}.png')`;
            targetElement.style.border = '2px solid #fff';
            targetElement.ondragover = null;
            state.assembledCount++;
            playSound('success');
            
            if (state.assembledCount === 5) {
                setTimeout(() => {
                    state.step = 1;
                    exitAssemble();
                    document.getElementById('singer-broken').style.display = 'none';
                    document.getElementById('singer-full').style.display = 'flex';
                    showDialog("主唱机器人拼装完成！跟他互动一下吧！");
                }, 1000);
            }
        }
    }
}

// --- 设置系统 ---
let sfxVolume = 0.8;   // 音效全局音量 (0~1)
let musicVolume = 0.7; // 音乐全局音量 (0~1)

// 音量设置在所有关卡间共用（与 Demo_Level0 同一对键，值统一为 0~100 的整数）
const VOLUME_PREFIX = 'linkgame_';

// 初始化音量（从 localStorage 读取）
(function initVolumes() {
    const savedMusic = localStorage.getItem(VOLUME_PREFIX + 'music_vol');
    const savedSfx = localStorage.getItem(VOLUME_PREFIX + 'sfx_vol');
    if (savedMusic !== null) {
        musicVolume = parseInt(savedMusic) / 100;
        document.getElementById('vol-music').value = Math.round(musicVolume * 100);
        document.getElementById('vol-music-val').textContent = Math.round(musicVolume * 100);
        const bgm = document.getElementById('bgm');
        const bgm2 = document.getElementById('bgm2');
        if (bgm) bgm.volume = musicVolume;
        if (bgm2) bgm2.volume = musicVolume;
    }
    if (savedSfx !== null) {
        sfxVolume = parseInt(savedSfx) / 100;
        document.getElementById('vol-sfx').value = Math.round(sfxVolume * 100);
        document.getElementById('vol-sfx-val').textContent = Math.round(sfxVolume * 100);
    }
    // 设置所有 SFX <audio> 元素的音量
    document.querySelectorAll('audio[id^="sfx-"]').forEach(el => el.volume = sfxVolume);
})();

function toggleSettings() {
    const overlay = document.getElementById('settings-overlay');
    overlay.classList.toggle('active');
    if (overlay.classList.contains('active')) {
        document.getElementById('backpack-overlay').classList.remove('show');
    }
}

function onMusicVolume(value) {
    musicVolume = parseInt(value) / 100;
    document.getElementById('vol-music-val').textContent = value;
    const bgm = document.getElementById('bgm');
    const bgm2 = document.getElementById('bgm2');
    if (bgm) bgm.volume = musicVolume;
    if (bgm2) bgm2.volume = musicVolume;
    localStorage.setItem(VOLUME_PREFIX + 'music_vol', value);
}

function onSfxVolume(value) {
    sfxVolume = parseInt(value) / 100;
    document.getElementById('vol-sfx-val').textContent = value;
    // 设置所有 SFX <audio> 元素音量
    document.querySelectorAll('audio[id^="sfx-"]').forEach(el => el.volume = sfxVolume);
    localStorage.setItem(VOLUME_PREFIX + 'sfx_vol', value);
}

function openExternalLink() {
    window.open('https://link-project.super.site/', '_blank');
}

// --- 物品栏拖拽滚动逻辑 ---
const inventoryEle = document.getElementById('ui-inventory');
let isDraggingInventory = false;
let startY;
let scrollTop;

inventoryEle.addEventListener('mousedown', (e) => {
    // 如果点击的是物品本身，则不触发拖拽滚动，保留原生的物品拖拽功能
    if (e.target.classList.contains('inv-item')) return;
    
    isDraggingInventory = true;
    inventoryEle.style.cursor = 'url(images/cursor-grabbing.png) 16 16, grabbing';
    startY = e.clientY;
    scrollTop = inventoryEle.scrollTop;
});

inventoryEle.addEventListener('mouseleave', () => {
    isDraggingInventory = false;
    inventoryEle.style.cursor = '';
});

inventoryEle.addEventListener('mouseup', () => {
    isDraggingInventory = false;
    inventoryEle.style.cursor = '';
});

inventoryEle.addEventListener('mousemove', (e) => {
    if (!isDraggingInventory) return;
    e.preventDefault();
    const y = e.clientY;
    const walk = (y - startY) * 1.5; // 滚动速度系数
    inventoryEle.scrollTop = scrollTop - walk;
});
</script>
